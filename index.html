function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}
function daysInMonth(year, month) {
  if (!year || !month) return 31;
  if (month === 2 && isLeapYear(parseInt(year, 10))) return 29;
  return MONTH_DAYS[month - 1];
}

// 西洋占星術の12星座(本日の運勢のバリエーション付けの内部計算にのみ使用)
const ZODIAC_RANGES = [
  { start: [3, 21], end: [4, 19] }, { start: [4, 20], end: [5, 20] },
  { start: [5, 21], end: [6, 21] }, { start: [6, 22], end: [7, 22] },
  { start: [7, 23], end: [8, 22] }, { start: [8, 23], end: [9, 22] },
  { start: [9, 23], end: [10, 23] }, { start: [10, 24], end: [11, 22] },
  { start: [11, 23], end: [12, 21] }, { start: [12, 22], end: [1, 19] },
  { start: [1, 20], end: [2, 18] }, { start: [2, 19], end: [3, 20] },
];
function signIndexFromMonthDay(month, day) {
  const md = month * 100 + day;
  for (let idx = 0; idx < ZODIAC_RANGES.length; idx++) {
    const z = ZODIAC_RANGES[idx];
    const s = z.start[0] * 100 + z.start[1];
    const e = z.end[0] * 100 + z.end[1];
    if (s > e) {
      if (md >= s || md <= e) return idx;
    } else if (md >= s && md <= e) {
      return idx;
    }
  }
  return ZODIAC_RANGES.length - 1;
}

function animalIndexFromYear(year) {
  return ((year - 4) % 12 + 12) % 12;
}
function animalLabel(idx) {
  return `${ANIMALS[idx]}(${ANIMAL_READINGS[idx]})年`;
}

function dateToDayOfYear(month, day) {
  let doy = day;
  for (let m = 0; m < month - 1; m++) doy += MONTH_DAYS[m];
  return doy;
}

function parseBirthdate(dateStr) {
  if (!dateStr) return null;
  const [yStr, mStr, dStr] = dateStr.split("-");
  return { year: parseInt(yStr, 10), month: parseInt(mStr, 10), day: parseInt(dStr, 10) };
}

function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function dayVector(doy) {
  const rand = mulberry32(doy * 9301 + 49297);
  return [0, 1, 2, 3].map(() => Math.round(rand() * 10));
}

function fullVector(year, month, day) {
  const doy = dateToDayOfYear(month, day);
  const dv = dayVector(doy);
  const av = ANIMAL_VECTORS[animalIndexFromYear(year)];
  return dv.map((v, i) => (v + av[i]) / 2);
}

function matchPercent(vecA, vecB) {
  const distSq = vecA.reduce((sum, v, i) => sum + (v - vecB[i]) ** 2, 0);
  const dist = Math.sqrt(distSq);
  const score = 99 - dist * 2.4;
  return Math.max(50, Math.min(99, Math.round(score)));
}

// 登録されているお客様の中からTOP3を選ぶ。
// 実際のお客様(サンプル以外)が3人以上いればサンプルは候補から外し、
// 3人未満の場合はサンプルも候補に含めつつ、必ず実際のお客様より下位に表示する。
function computeTop3(target, pool) {
  const others = pool.filter((a) => a.id !== target.id);
  const realOthers = others.filter((a) => !a.isSample);
  const sampleOthers = others.filter((a) => a.isSample);

  const candidates = realOthers.length >= 3 ? realOthers : [...realOthers, ...sampleOthers];

  return candidates
    .map((a) => ({ ...a, score: matchPercent(target.vec, a.vec) }))
    .sort((a, b) => {
      if (a.isSample !== b.isSample) return a.isSample ? 1 : -1;
      return b.score - a.score;
    })
    .slice(0, 3);
}

// ---------------------------------------------------------------------------
// 〇〇タイプ(元素バランス診断): 生年月日・出生時間・出生地・性別から
// 火/地/風/水の4元素バランスを算出し、「〇・〇優位タイプ」として判定する。
// ---------------------------------------------------------------------------
const ELEMENT_NAMES = ["火", "地", "風", "水"];
const SIMPLE_ADJ = ["情熱的", "堅実", "論理的", "情に厚い"];
const LACK_NOTE = ["決断力", "現実的な処理", "客観的な視点", "気持ちのケア"];
const ROMANCE_NOUN = {
  "0-1": "実行力のあるリアリスト",
  "0-2": "発信力のあるアイデアマン",
  "0-3": "情熱的なロマンチスト",
  "1-2": "堅実な戦略家",
  "1-3": "包容力のある癒し系",
  "2-3": "感受性豊かな共感者",
};

function elementCounts(seed) {
  const rand = mulberry32(seed);
  const raw = [rand() + 0.15, rand() + 0.15, rand() + 0.15, rand() + 0.15];
  const total = raw.reduce((a, b) => a + b, 0);
  let counts = raw.map((r) => Math.round((r / total) * 10));
  let diff = 10 - counts.reduce((a, b) => a + b, 0);
  let i = 0;
  while (diff !== 0) {
    const idx = i % 4;
    if (diff > 0) { counts[idx] += 1; diff -= 1; }
    else if (counts[idx] > 0) { counts[idx] -= 1; diff += 1; }
    i++;
  }
  return counts;
}

function compositeType(counts) {
  const order = [0, 1, 2, 3].sort((a, b) => counts[b] - counts[a]);
  const [top1, top2, , ] = order;
  const lack1 = order[2];
  const lack2 = order[3];
  const pairKey = [top1, top2].sort((a, b) => a - b).join("-");
  const noun = ROMANCE_NOUN[pairKey] || "バランス型";
  const typeName = `${ELEMENT_NAMES[top1]}・${ELEMENT_NAMES[top2]}優位タイプ`;
  const description = `${SIMPLE_ADJ[top1]}で${SIMPLE_ADJ[top2]}な${noun}/${ELEMENT_NAMES[lack1]}・${ELEMENT_NAMES[lack2]}不足のため${LACK_NOTE[lack1]}や${LACK_NOTE[lack2]}のカバーが必要`;
  return { typeName, description, counts };
}

function computeCompositeType(year, month, day, hour, prefecture, gender) {
  const seedStr = `${year}_${month}_${day}_${hour}_${prefecture}_${gender}`;
  const counts = elementCounts(hashString(seedStr));
  return compositeType(counts);
}

  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const rand = mulberry32(month * 131 + day * 7 + signIdx * 991);
  const stars = 1 + Math.floor(rand() * 5);
  const text = TODAY_TEMPLATES[Math.floor(rand() * TODAY_TEMPLATES.length) % TODAY_TEMPLATES.length];
  return { month, day, stars, text };
}

function formatBirthdate(dateStr) {
  const p = parseBirthdate(dateStr);
  if (!p) return "";
  return `${p.year}年${p.month}月${p.day}日`;
}

function buildAttendee({ name, birthdate, gender, prefecture, birthTime, isSample }) {
  const p = parseBirthdate(birthdate);
  const doy = dateToDayOfYear(p.month, p.day);
  const animalIdx = animalIndexFromYear(p.year);
  const signIdx = signIndexFromMonthDay(p.month, p.day);
  const hour = birthTime ? parseInt(birthTime.split(":")[0], 10) : 12;
  const type = computeCompositeType(p.year, p.month, p.day, hour, prefecture || "不明", gender || "回答しない");
  return {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    name,
    birthdate,
    gender: gender || "回答しない",
    prefecture: prefecture || "不明",
    birthTime: birthTime || "",
    year: p.year,
    doy,
    animalIdx,
    signIdx,
    typeName: type.typeName,
    typeDescription: type.description,
    vec: fullVector(p.year, p.month, p.day),
    isSample: !!isSample,
    registeredAt: Date.now(),
  };
}

  const [confirmingReset, setConfirmingReset] = useState(false);
  const [revealStage, setRevealStage] = useState(0);
  const monthRef = useRef(null);
  const dayRef = useRef(null);

  useEffect(() => {
    if (!reveal) return;
    setRevealStage(0);
    const timers = [1, 2, 3].map((n) =>
      setTimeout(() => setRevealStage(n), n * 450)
    );
    return () => timers.forEach(clearTimeout);
  }, [reveal]);

  function handleRegister(e) {
    e.preventDefault();
    if (!name.trim() || !byear || !bmonth || !bday || !gender || !prefecture) return;

    const birthdate = `${byear}-${String(bmonth).padStart(2, "0")}-${String(bday).padStart(2, "0")}`;
    const newAttendee = buildAttendee({ name: name.trim(), birthdate, gender, prefecture, birthTime, isSample: false });
    const next = [...attendees, newAttendee];
    const scored = computeTop3(newAttendee, next);
    setAttendees(next);
    setReveal({ attendee: newAttendee, top3: scored });
    setName("");
    setByear("");
    setBmonth("");
    setBday("");
    setGender("");
    setPrefecture("");
    setBirthTime("");
  }

  function handleReset() {
    setAttendees([]);
    setReveal(null);
    setConfirmingReset(false);
  }

  const SAMPLE_NAMES = ["さくら", "ゆかり", "たける", "みき", "しょうた", "あやか", "けんじ", "なつき"];

  function randomBirthdate() {
    const year = 1985 + Math.floor(Math.random() * 20);
    const month = 1 + Math.floor(Math.random() * 12);
    const day = 1 + Math.floor(Math.random() * 28);
    return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }

  function handleAddSamples() {
    const room = MAX_CAPACITY - attendees.length;
    const count = Math.min(3, room);
    if (count <= 0) return;

    const additions = Array.from({ length: count }).map(() => {
      const label = SAMPLE_NAMES[Math.floor(Math.random() * SAMPLE_NAMES.length)];
      const pref = PREFECTURES[Math.floor(Math.random() * PREFECTURES.length)];
      const g = GENDERS[Math.floor(Math.random() * GENDERS.length)];
      return buildAttendee({
        name: `${label}(サンプル)`,
        birthdate: randomBirthdate(),
        gender: g,
        prefecture: pref,
        birthTime: "",
        isSample: true,
      });
    });

    setAttendees((prev) => [...prev, ...additions]);
  }

  const emptyBulkRow = () => ({ name: "", byear: "", bmonth: "", bday: "", gender: "", prefecture: "", birthTime: "" });
  const [bulkRows, setBulkRows] = useState(Array.from({ length: 5 }, emptyBulkRow));
  const bulkMonthRefs = useRef([]);
  const bulkDayRefs = useRef([]);

  function updateBulkRow(idx, field, value) {
    setBulkRows((rows) => rows.map((r, i) => (i === idx ? { ...r, [field]: value } : r)));
  }

  function handleBulkRegister(e) {
    e.preventDefault();
    const validRows = bulkRows.filter((r) => r.name.trim() && r.byear && r.bmonth && r.bday && r.gender && r.prefecture);
    if (validRows.length === 0) return;

    const room = MAX_CAPACITY - attendees.length;
    const toAdd = validRows.slice(0, room).map((r) =>
      buildAttendee({
        name: r.name.trim(),
        birthdate: `${r.byear}-${String(r.bmonth).padStart(2, "0")}-${String(r.bday).padStart(2, "0")}`,
        gender: r.gender,
        prefecture: r.prefecture,
        birthTime: r.birthTime,
        isSample: false,
      })
    );

    const next = [...attendees, ...toAdd];
    setAttendees(next);
    setBulkRows(Array.from({ length: 5 }, emptyBulkRow));

    const last = toAdd[toAdd.length - 1];
    if (last) setReveal({ attendee: last, top3: computeTop3(last, next) });
  }

  const full = attendees.length >= MAX_CAPACITY;

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background:
          "radial-gradient(circle at 20% 0%, #241a3f 0%, #150f27 55%, #0f0a1d 100%)",
        color: "#F3EDE3",
        fontFamily: "'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
        .serif-jp { font-family: 'Shippori Mincho', serif; }
        @keyframes riseIn {
          from { opacity: 0; transform: translateY(14px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .rise { animation: riseIn 0.5s ease forwards; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
        select option { color: #150F27; }
      `}</style>

      <div className="max-w-5xl mx-auto px-5 py-8 md:py-12">
        {/* ヘッダー */}
        <header className="flex items-center justify-between flex-wrap gap-3 mb-10 pb-6" style={{ borderBottom: "1px solid #3A2E58" }}>
          <div className="flex items-center gap-3">
            <span style={{ fontSize: "22px" }}>✨</span>
            <h1 className="serif-jp text-2xl md:text-3xl tracking-wide" style={{ color: "#F3EDE3" }}>
              占心 — Fortune Match
            </h1>
          </div>
          <div className="flex items-center gap-2 text-sm" style={{ color: full ? "#E29A9A" : "#C9A24C" }}>
            <span>👥</span>
            <span>{attendees.length} / {MAX_CAPACITY} 名 登録済み</span>
          </div>
        </header>

        {/* 結果表示 */}
          <section className="rise">
            {!reveal ? (
              <div
                className="h-full min-h-[320px] flex flex-col items-center justify-center text-center rounded-lg px-6"
                style={{ border: "1px dashed #3A2E58", color: "#8477A0" }}
              >
                <div className="mb-3" style={{ fontSize: "28px" }}>🌙</div>
                <p className="serif-jp text-lg mb-1" style={{ color: "#B9AECB" }}>まだ結果はありません</p>
                <p className="text-sm">情報を登録すると、占いタイプと運勢、相性の良いお相手TOP3がここに表示されます。</p>
              </div>
            ) : (
              <div className="rounded-lg p-6 rise" style={{ background: "#1B1330", border: "1px solid #3A2E58" }}>
                <p className="text-sm mb-1" style={{ color: "#8477A0" }}>{reveal.attendee.name} さん</p>
                <h2 className="serif-jp text-2xl mb-1" style={{ color: "#C9A24C" }}>
                  {reveal.attendee.typeName}
                </h2>
                <p className="text-sm mb-5" style={{ color: "#B9AECB" }}>
                  ({reveal.attendee.typeDescription})
                </p>

                {(() => {
                  const today = todayFortuneFor(reveal.attendee.signIdx);
                  return (
                    <div className="mb-6 px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                      <div className="flex items-center justify-between mb-1">
                        <p className="text-xs" style={{ color: "#C9A24C" }}>{today.month}月{today.day}日の運勢</p>
                        <p style={{ color: "#C9A24C", letterSpacing: "1px" }}>
                          {"★".repeat(today.stars)}{"☆".repeat(5 - today.stars)}
                        </p>
                      </div>
                      <p className="text-sm leading-relaxed">{today.text}</p>
                    </div>
                  );
                })()}

                <div className="grid sm:grid-cols-2 gap-3 mb-7">
                  {[
                    { key: "work", label: "仕事運" },
                    { key: "money", label: "金銭運" },
                    { key: "love", label: "恋愛運" },
                    { key: "personality", label: "性格判断" },
                  ].map(({ key, label }) => (
                    <div key={key} className="px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                      <p className="text-xs mb-1" style={{ color: "#C9A24C" }}>{label}</p>
                      <p className="text-sm leading-relaxed">{dailyFortuneTexts(reveal.attendee.year, reveal.attendee.doy)[key]}</p>
                    </div>
                  ))}
                </div>

                <p className="text-sm mb-3" style={{ color: "#8477A0" }}>相性の良いお相手 TOP3</p>

                {reveal.top3.length === 0 ? (
                  <p style={{ color: "#8477A0" }}>まだ他に登録者がいません。次のお客様の登録をお待ちください。</p>
                ) : (
                  <div className="space-y-3">
                    {reveal.top3.map((m, idx) => (
                      revealStage > idx && (
                        <div
                          key={m.id}
                          className="rise flex items-center justify-between px-4 py-3 rounded"
                          style={{
                            background: idx === 0 ? "#2E2350" : "#211A3B",
                            border: idx === 0 ? "1px solid #C9A24C" : "1px solid #3A2E58",
                          }}
                        >
                          <div className="flex items-center gap-3">
                            <span
                              className="serif-jp text-lg w-7 h-7 rounded-full flex items-center justify-center"
                              style={{
                                background: idx === 0 ? "#C9A24C" : "#3A2E58",
                                color: idx === 0 ? "#150F27" : "#F3EDE3",
                              }}
                            >
                              {idx + 1}
                            </span>
                            <span className="text-base">{m.name}</span>
                          </div>
                          <div className="flex items-center gap-1.5" style={{ color: "#E8B4BC" }}>
                            <span>❤️</span>
                            <span className="font-medium">{m.score}%</span>
                          </div>
                        </div>
                      )
                    ))}
                  </div>
                )}

                <button
                  onClick={() => setReveal(null)}
                  className="mt-6 text-sm underline"
                  style={{ color: "#8477A0" }}
                >
                  閉じて次のお客様を登録する
                </button>
              </div>
            )}
          </section>

          {/* 登録フォーム */}
          <section className="mt-10 rise">
            <h2 className="serif-jp text-lg mb-4 flex items-center gap-2" style={{ color: "#C9A24C" }}>
              <span>📅</span>
              占い結果を登録
            </h2>

            <form onSubmit={handleRegister} className="space-y-4">
              <div>
                <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>
                  お客様のお名前
                </label>
                <input
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="例）田中 ゆかり"
                  disabled={full}
                  className="w-full px-3 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>性別</label>
                  <select
                    value={gender}
                    onChange={(e) => setGender(e.target.value)}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">選択</option>
                    {GENDERS.map((g) => (
                      <option key={g} value={g}>{g}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>出生地</label>
                  <select
                    value={prefecture}
                    onChange={(e) => setPrefecture(e.target.value)}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">選択</option>
                    {PREFECTURES.map((p) => (
                      <option key={p} value={p}>{p}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm mb-1 flex items-center gap-1" style={{ color: "#B9AECB" }}>
                  <span>📅</span> 生年月日
                </label>
                <div className="grid grid-cols-3 gap-2">
                  <select
                    value={byear}
                    onChange={(e) => {
                      setByear(e.target.value);
                      if (e.target.value) monthRef.current?.focus();
                    }}
                    disabled={full}
                    className="w-full px-2 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">年</option>
                    {YEAR_OPTIONS.map((y) => (
                      <option key={y} value={y}>{y}年</option>
                    ))}
                  </select>
                  <select
                    ref={monthRef}
                    value={bmonth}
                    onChange={(e) => {
                      setBmonth(e.target.value);
                      if (e.target.value) dayRef.current?.focus();
                    }}
                    disabled={full}
                    className="w-full px-2 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">月</option>
                    {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                      <option key={m} value={m}>{m}月</option>
                    ))}
                  </select>
                  <select
                    ref={dayRef}
                    value={bday}
                    onChange={(e) => setBday(e.target.value)}
                    disabled={full}
                    className="w-full px-2 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">日</option>
                    {Array.from({ length: daysInMonth(byear, bmonth) }, (_, i) => i + 1).map((d) => (
                      <option key={d} value={d}>{d}日</option>
                    ))}
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>
                  出生時間(不明の場合は空欄のまま・12時として占います)
                </label>
                <input
                  type="time"
                  value={birthTime}
                  onChange={(e) => setBirthTime(e.target.value)}
                  disabled={full}
                  className="w-full px-3 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                />
              </div>

              <button
                type="submit"
                disabled={full || !name.trim() || !byear || !bmonth || !bday || !gender || !prefecture}
                className="w-full py-2.5 rounded font-medium transition-opacity disabled:opacity-40"
                style={{ background: "#C9A24C", color: "#150F27" }}
              >
                {full ? "満員です" : "【名前・生年月日を入力】"}
              </button>
            </form>

            <button
              onClick={handleAddSamples}
              disabled={full}
              className="mt-3 w-full py-2 rounded text-sm disabled:opacity-40"
              style={{ background: "transparent", border: "1px dashed #3A2E58", color: "#8477A0" }}
            >
              テスト用にサンプルを3件追加する
            </button>


          </section>


        {/* 5名まとめて登録(実データ用・サンプルとは別枠) */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <h2 className="serif-jp text-lg mb-1 flex items-center gap-2" style={{ color: "#C9A24C" }}>
            <span>👥</span>
            実際のお客様を5名まとめて登録
          </h2>
          <p className="text-sm mb-4" style={{ color: "#8477A0" }}>
            テスト用サンプルとは別に、実際のお客様の情報をまとめて登録できます。
          </p>

          <form onSubmit={handleBulkRegister} className="space-y-4">
            {bulkRows.map((row, idx) => (
              <div key={idx} className="grid md:grid-cols-12 gap-2 md:items-center pb-3" style={{ borderBottom: "1px solid #2A2145" }}>
                <div className="md:col-span-3">
                  <label className="block text-xs mb-1 md:hidden" style={{ color: "#8477A0" }}>お名前</label>
                  <input
                    value={row.name}
                    onChange={(e) => updateBulkRow(idx, "name", e.target.value)}
                    placeholder={`お客様${idx + 1}のお名前`}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs mb-1 md:hidden" style={{ color: "#8477A0" }}>性別</label>
                  <select
                    value={row.gender}
                    onChange={(e) => updateBulkRow(idx, "gender", e.target.value)}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">性別</option>
                    {GENDERS.map((g) => (
                      <option key={g} value={g}>{g}</option>
                    ))}
                  </select>
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs mb-1 md:hidden" style={{ color: "#8477A0" }}>出生地</label>
                  <select
                    value={row.prefecture}
                    onChange={(e) => updateBulkRow(idx, "prefecture", e.target.value)}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  >
                    <option value="">出生地</option>
                    {PREFECTURES.map((p) => (
                      <option key={p} value={p}>{p}</option>
                    ))}
                  </select>
                </div>
                <div className="md:col-span-3">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>生年月日</label>
                  <div className="grid grid-cols-3 gap-1">
                    <select
                      value={row.byear}
                      onChange={(e) => {
                        updateBulkRow(idx, "byear", e.target.value);
                        if (e.target.value) bulkMonthRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">年</option>
                      {YEAR_OPTIONS.map((y) => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkMonthRefs.current[idx] = el)}
                      value={row.bmonth}
                      onChange={(e) => {
                        updateBulkRow(idx, "bmonth", e.target.value);
                        if (e.target.value) bulkDayRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">月</option>
                      {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                        <option key={m} value={m}>{m}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkDayRefs.current[idx] = el)}
                      value={row.bday}
                      onChange={(e) => updateBulkRow(idx, "bday", e.target.value)}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">日</option>
                      {Array.from({ length: daysInMonth(row.byear, row.bmonth) }, (_, i) => i + 1).map((d) => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>出生時間</label>
                  <input
                    type="time"

                    onChange={(e) => updateBulkRow(idx, "birthTime", e.target.value)}

                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  />
                </div>
              </div>

            <button
              type="submit"

              className="px-5 py-2.5 rounded font-medium disabled:opacity-40"
              style={{ background: "#C9A24C", color: "#150F27" }}
            >
              入力済みのお客様をまとめて登録する
            </button>
            <p className="text-xs" style={{ color: "#8477A0" }}>
              名前・性別・出生地・生年月日が揃っている行だけ登録されます(出生時間は空欄可・その場合12時で計算)。
            </p>
          </form>
        </section>

        {/* 登録済みのお客様一覧 */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="serif-jp text-lg flex items-center gap-2" style={{ color: "#C9A24C" }}>
              <span>👥</span>
              登録済みのお客様
            </h2>
            {attendees.length > 0 && (
              !confirmingReset ? (
                <button
                  onClick={() => setConfirmingReset(true)}
                  className="text-xs flex items-center gap-1"
                  style={{ color: "#8477A0" }}
                >
                  <span>🔄</span> リセット

              ) : (
                <div className="flex items-center gap-2 text-xs">
                  <span style={{ color: "#E8B4BC" }}>全員削除しますか?</span>
                  <button onClick={handleReset} style={{ color: "#E8B4BC" }} className="underline">はい</button>
                  <button onClick={() => setConfirmingReset(false)} style={{ color: "#8477A0" }} className="underline">いいえ</button>
                </div>

          </div>

          {attendees.length === 0 ? (
            <p className="text-sm" style={{ color: "#8477A0" }}>まだ登録されているお客様がいません。</p>
          ) : (
            <ul className="space-y-1 max-h-96 overflow-y-auto pr-1">
              {attendees.slice().reverse().map((a, i) => (
                <li
                  key={a.id}
                  className="text-sm px-3 py-2 rounded flex items-center justify-between gap-2"
                  style={{ background: "#1B1330" }}
                >
                  <span className="truncate">{attendees.length - i}. {a.name}</span>
                  <span style={{ color: "#8477A0" }} className="truncate">

                    className="text-xs shrink-0 underline"

                  >
                    結果を見る
                  </button>
                </li>
              ))}
            </ul>
          )}
        </section>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<FortuneMatchApp />);
</script>
