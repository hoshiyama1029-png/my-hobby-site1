// マヤ暦(ツォルキン暦)占い: 生年月日だけで「太陽の紋章(20種)」×「銀河の音(13種)」の
// 組み合わせ(KIN1〜260)を算出し、そこから運勢・相性を判定する。
// ---------------------------------------------------------------------------
const MAX_CAPACITY = 30;

function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}
const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function daysInMonth(year, month) {
  if (!year || !month) return 31;
  if (parseInt(month, 10) === 2 && isLeapYear(parseInt(year, 10))) return 29;
  return MONTH_DAYS[parseInt(month, 10) - 1];
}
const { useState, useEffect, useRef } = React;
const CURRENT_YEAR = new Date().getFullYear();
const YEAR_OPTIONS = Array.from({ length: 90 }, (_, i) => CURRENT_YEAR - i);

function parseBirthdate(dateStr) {
  if (!dateStr) return null;
  const [yStr, mStr, dStr] = dateStr.split("-");
  return { year: parseInt(yStr, 10), month: parseInt(mStr, 10), day: parseInt(dStr, 10) };
}
function formatBirthdate(dateStr) {
  const p = parseBirthdate(dateStr);
  if (!p) return "";
  return `${p.year}年${p.month}月${p.day}日`;
}

// 生年月日から「その年を365日固定」とみなした通算日数を求める。
// 一般的なマヤ暦KIN早見表はうるう年をまたいでも365日/年で計算されているため、
// この方式に合わせることで実際の早見表・計算例と一致する。
const NONLEAP_CUM_DAYS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
function pseudoAbsoluteDay(year, month, day) {
  return year * 365 + NONLEAP_CUM_DAYS[month - 1] + day;
}

// マヤ暦(ツォルキン)のKINナンバー(1〜260)を算出する。
// 基準日: 1975年3月3日 = KIN189(複数の公開されているマヤ暦KIN計算例と照合して校正済み)
function kinFromDate(year, month, day) {
  const REF_ABS = pseudoAbsoluteDay(1975, 3, 3);
  const REF_KIN_INDEX0 = 188; // KIN189の0始まりインデックス
  const diff = pseudoAbsoluteDay(year, month, day) - REF_ABS;
  const idx0 = (((REF_KIN_INDEX0 + diff) % 260) + 260) % 260;
  return idx0 + 1; // 1〜260
}

];
const TONE_VECTORS = [
  [7, 5, 4, 4], [3, 4, 7, 5], [8, 5, 3, 4], [4, 7, 8, 3], [7, 6, 5, 6],
  [4, 5, 9, 4], [5, 6, 5, 7], [6, 7, 6, 5], [8, 4, 5, 6], [7, 5, 7, 4],

function mayaInfo(year, month, day) {
  const kin = kinFromDate(year, month, day);
  const toneIdx = (kin - 1) % 13;
  const daySignIdx = (kin - 1) % 20;
  return { kin, toneIdx, daySignIdx };
}
function mayaVector(toneIdx, daySignIdx) {
  const t = TONE_VECTORS[toneIdx];
  const d = DAY_SIGN_VECTORS[daySignIdx];
  return t.map((v, i) => (v + d[i]) / 2);
}

function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function matchPercent(vecA, vecB) {
  const distSq = vecA.reduce((sum, v, i) => sum + (v - vecB[i]) ** 2, 0);
  const dist = Math.sqrt(distSq);
  const score = 99 - dist * 2.4;
  return Math.max(50, Math.min(99, Math.round(score)));
}

// 登録されているお客様の中からTOP3を選ぶ。
// 実際のお客様(サンプル以外)が3人以上いればサンプルは候補から外し、
// 3人未満の場合はサンプルも候補に含めつつ、必ず実際のお客様より下位に表示する。
function computeTop3(target, pool) {
  const others = pool.filter((a) => a.id !== target.id);
  const realOthers = others.filter((a) => !a.isSample);
  const sampleOthers = others.filter((a) => a.isSample);
  const candidates = realOthers.length >= 3 ? realOthers : [...realOthers, ...sampleOthers];

  return candidates
    .map((a) => ({ ...a, score: matchPercent(target.vec, a.vec) }))
    .sort((a, b) => {
      if (a.isSample !== b.isSample) return a.isSample ? 1 : -1;
      return b.score - a.score;
    })
    .slice(0, 3);
}

  { work: "強い信念と粘り強さで困難を乗り越えるエネルギーがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し、成果を勝ち取ることができます。", love: "情熱的で一途な愛を注ぎます。困難があるほど燃え上がる傾向がありますが、独占欲や執着心が強くなりすぎないよう注意が必要です。相手を信頼して見守る余裕を持つと関係が安定します。", relationship: "意志が強く頼りになるため、いざという時に頼りにされる存在です。自分の考えを押し通そうとすると孤立しかねないため、周囲の意見をよく聞き、調和を図る歩み寄りの姿勢が欠かせません。" },
  { work: "豊かな想像力と無から有を生み出すインスピレーションに恵まれています。クリエイターや執筆業、心理・スピリチュアル分野など、目に見えない感覚を表現する仕事で才能を発揮します。", love: "言葉を超えた心の世界での深い繋がりを求めます。とてもロマンチックですが、現実的な問題から目を背けがちな面も。理想だけでなく、日々の生活や現実的な会話も大切にすることが成就の鍵です。", relationship: "感受性が豊かで人の痛みがわかる優しい人柄です。雰囲気を察するのが得意ですが、過度に考えすぎて思い悩むこともあるため、境界線を引いて前向きな人と付き合うことが運気アップに繋がります。" },
  { work: "強い信念と先見の明を持ち、プロジェクトを牽引する力があります。起業家や組織のリーダー、企画開発など、目標に向かってブレずに道を開拓していく分野で真価を発揮します。", love: "情熱的で、お互いに高め合える自立した関係を好みます。主導権を握りたがる傾向があるため、自分のペースを押し付けず、相手の価値観や意見を尊重する姿勢を持つと円満になります。", relationship: "意志が強く堂々とした存在感で周囲を引っ張ります。周囲からの信頼は厚いですが、頑固になりすぎると壁を作ってしまうため、相手の話に耳を傾ける寛容さを意識することが大切です。" },
  { work: "細やかな気配りとバランス感覚に優れ、組織の環境整備や調整業務で力を発揮します。人事・労務や接客業、福祉関連など、人や現場を支えるポジションで高い評価を得ます。", love: "誠実で相手を包み込むような優しさを持っています。安定した関係を築けますが、相手に気を使いすぎてストレスを溜め込みがちなため、素直に本音を伝え合える雰囲気作りが欠かせません。", relationship: "穏やかで協調性があり、誰からも親しまれる平和主義者です。争い事を避けるあまり自分の意見を抑えがちになるため、時には自分の意思をはっきり伝えることでより深い信頼が得られます。" },
  { work: "豊かな感性とアイデア力があり、人を喜ばせる企画や広報、エンターテインメント関連の仕事に向いています。柔軟な発想で場に新しい風を吹き込む役割を担います。", love: "一緒にいて楽しい刺激的な関係を好みます。サービス精神が旺盛で相手を楽しませますが、気分屋な面が出ると誤解を招くことも。感情の波を整え、誠意を見せることが長続きの秘訣です。", relationship: "明るくフレンドリーで、場の雰囲気を一瞬で和ませる魅力があります。人付き合いは得意ですが、軽はずみな言動にならないよう注意し、約束を守る姿勢を徹底すると評価が高まります。" },
  { work: "探究心が強く、専門的な知識や技術を深める仕事で成果を出します。研究職やエンジニア、分析業務など、一つのテーマを掘り下げて精度を高めていく職種に適性があります。", love: "慎重で一途な恋愛傾向にあり、時間をかけてゆっくり信頼関係を育みます。派手さはありませんが誠実で安定感があります。時には素直な好きという感情を言葉に表すと進展しやすくなります。", relationship: "落ち着きがあり、聞き手に回ることが多い誠実な人物です。洞察力がありますが、納得いかないと心を閉ざしやすいため、違いを受け入れる柔軟性を持つと人間関係の幅が広がります。" },
  { work: "中心となって大勢をまとめる強い影響力があります。経営者やプロジェクトリーダー、各種マネジメント職など、自ら判断を下し組織をダイナミックに動かす環境で真価を発揮します。", love: "頼りがいがあり、パートナーを力強くリードします。情熱的ですが自分の思い通りに動かそうとしやすいため、相手の気持ちやペースを優先する心の余裕を持つと関係がスムーズになります。", relationship: "存在感があり、自然と人が集まるカリスマ性を持っています。説得力がある反面、威圧的にならないよう注意が必要です。謙虚な態度と思いやりを意識することで人望が不動のものになります。" },
  { work: "全体を調和させ、チームを円滑に機能させる調整力に長けています。総務や事務管理、仲介業や地域活動など、人と人をつないで組織の土台を固める仕事で高い適性を発揮します。", love: "相手の立場に立ち、温かく支える愛情深いパートナーです。安心感を重視しますが、過保護になりすぎると相手の成長を妨げることも。互いに自立した関係性を保つことが成功の鍵です。", relationship: "誰に対しても親切で、揉め事を収めるのが得意な平和主義者です。八方美人と思われないよう自分の軸をしっかり持ち、必要なときは断る勇気を持つことで真の信頼関係が構築できます。" },
  { work: "直感力と情報分析力が高く、スピード感が求められる分野で活躍します。IT・マスコミやコンサルティングなど、膨大な情報を整理して的確な価値を生み出す仕事に向いています。", love: "知的で軽やかなコミュニケーションを楽しめる関係を好みます。お互いの自由を尊重し合いたいタイプですが、論理的になりすぎず、たまには感情をオープンに表すことが親密さを深めます。", relationship: "話題が豊富で人脈を広げるのが得意です。軽快な付き合いができますが、浅く広い関係になりがちな面も。心から信頼できる特定の人とじっくり向き合う時間も大切にすると吉です。" },
  { work: "情熱とエネルギーに満ち、目標達成に向けて突き進みます。営業職や新規開拓、スポーツ関連など、自分の力で現場を動かし結果を出すアクティブな環境で才能が開花します。", love: "好きになったらストレートにアプローチする熱血タイプです。一途で情熱的ですが、相手のペースを無視して突っ走りすぎないよう、相手の気持ちに寄り添う落ち着きも大切になります。", relationship: "周囲を明るく鼓舞する頼もしい存在です。面倒見が良い反面、自分のペースや意見を押し付けがちになることもあるため、相手の事情を配慮する寛容さを持つとより円滑になります。" },
  { work: "優れたセンスと表現力を持ち、人に感動を与える仕事で輝きます。広報・ブランディングや芸術、デザインなど、自らの世界観を打ち出して人を惹きつける分野に高い適性があります。", love: "ロマンチックで情熱的な恋愛を求めるタイプです。魅力的で引きつける力がありますが、気分で態度が変わりやすい面も。感情のコントロールを心がけることで安定した関係が築けます。", relationship: "華やかな雰囲気があり、場の中心になりやすい人気者です。気分屋と思われるのを防ぐため、誰に対しても分け隔てなく誠実に対応することを意識すると信頼感が一層高まります。" },
  { work: "アイデアを具体的な形に落とし込む現実的な実行力があります。建設・製造や企画の具体化、現場の管理業務など、着実に成果物を作り上げていく仕事で信頼と実績を獲得します。", love: "誠実で約束を重んじる堅実な恋愛を好みます。派手なアプローチは苦手ですが、時間をかけて信頼を築きます。真面目になりすぎず、たまには感情を素直に出して甘えることも大切です。", relationship: "礼儀正しく責任感が強いため、周囲から一目置かれます。形式やルールにこだわりすぎると堅苦しく見えがちなため、相手の価値観を柔軟に受け入れる大らかさを意識しましょう。" },
  { work: "常識にとらわれない独自の視点で革新を起こすタイプです。ベンチャー企業での挑戦や商品開発、新しい働き方の提案など、自由な発想で変化を生み出す分野で実力を発揮します。", love: "個性的で自由度の高い恋愛スタイルを好みます。縛られることを嫌うため、互いに自立し尊重し合える関係がベストです。頑固にならず素直な気持ちを伝えることがすれ違いを防ぎます。", relationship: "強い信念とユニークな持ち味があり、刺激的な存在として惹きつけます。自分のこだわりを無理に通そうとせず、周囲との調和を図る意識を持つことで良好な人間関係が長続きします。" },
  { work: "人の気持ちに寄り添う親身なサポートが得意です。カウンセラーや医療・福祉、相談窓口など、相手の抱える問題や悩みを丁寧に聞き取り解決へ導く仕事で力を発揮します。", love: "相手に寄り添い、優しく尽くす包容力があります。ただし相手を優先するあまり自分の意見を我慢しがちになるため、定期的に自分の気持ちを素直に打ち明ける姿勢が大切です。", relationship: "温厚で聞き上手なため、多くの人から癒やしの存在として頼られます。人の感情を引き受けすぎて疲れやすいため、適度な距離感を保ち自分を大切にする時間を持つことが吉です。" },
  { work: "多様な要素をまとめ上げ、完成へと導く力があります。プロデューサーや統括管理職、教育分野など、全体の成果を回収して次のレベルへ昇華させるポジションで非凡な才能を見せます。", love: "深い包容力があり、パートナーを優しく見守る愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず、二人で過ごすプロセス自体を楽しむ余裕を持つと絆が深まります。", relationship: "器が大きく、様々な意見を取りまとめてまとめる能力があります。親身で頼られますが、一人で問題を抱え込みやすいため、周囲に上手に頼る姿勢を持つことで関係がより円滑になります。" },
  { work: "純粋な熱意と集中力で一つの物事を突き詰める職人タイプです。研究職や専門技術、開発業務など、妥協せずに質の高さを追求する仕事で素晴らしい実績を残すことができます。", love: "一度好きになった相手にはまっすぐで深い愛情を注ぎます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、お互いに一人の時間を大切にする適度な距離感が成功のポイントです。", relationship: "裏表がなく信用されますが、こだわりが強くマイペースになりがちです。自分の世界に閉じこもらず、周囲の意見にも関心を持って耳を傾けることで協調性が生まれます。" },
  { work: "人の才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野でリーダーシップを発揮します。", love: "互いに高め合える知的な関係を求めます。良きアドバイザーとなりますが、指導的になりすぎると相手に圧迫感を与えるため、ありのままの相手を受け入れる優しさを心がけましょう。", relationship: "視野が広く、人の良いところを発見するのが得意です。助言者として重宝されますが、正論だけで押し通さず、相手の感情に共感する姿勢を第一にすると人望がより一層高まります。" },
  { work: "本質を見抜き、改善点を発見する鋭い知性を持っています。品質管理やアナリスト、組織改革のコンサルタントなど、問題点を明確にして立て直す仕事で才能を発揮します。", love: "上辺だけではない本質的な信頼関係を望みます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく指摘しすぎないよう、温かい言葉を選ぶ優しさが大切になります。", relationship: "嘘がなく誠実な付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に褒めることで、円滑な人間関係が維持できます。" },
  { work: "計画性があり、目標に向けて着実にタスクをこなす実行力があります。プロジェクト管理や行政・公務、財務など、規律と正確性が求められる職種で高い信頼を得て活躍します。", love: "真面目で約束をしっかり守る信頼感抜群のパートナーです。安心感を与えますが、型にはまりすぎることがあるため、時にはサプライズや感情的な触れ合いを意識すると深い絆が生まれます。", relationship: "責任感が強く言動が安定しているため、周囲から厚い信頼を寄せられます。ルールに厳しくなりすぎず、相手の都合や失敗に対しても柔軟で寛容な態度接すると人間関係がスムーズになります。" },

  { work: "アイデアが豊富で、人を喜ばせる企画やイベントの打ち出しが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で活躍します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神旺盛ですが、気分屋な面が出ると相手を振り回すことも。感情を一定に保ち、誠意を示すことが長続きの鍵です。", relationship: "明るくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな約束にならないよう注意すると、さらに信頼性が増します。" },
  { work: "探究心が強く、専門分野の知識や技術を深く掘り下げる仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で大きな成果を出します。", love: "慎重で一途な恋愛傾向があり、じっくりと時間をかけて信頼関係を築きます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着いていて誠実なため、聞き手として厚い信頼を得ます。洞察力がありますが、納得いかないと頑固になりがちなため、異なる価値観を受け入れる柔軟性を持つと広がります。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら決断を下して組織を大きく動かすポジションで実力を発揮します。", love: "頼りがいがあり、パートナーをぐいぐい引っ張っていくタイプです。情熱的ですが強引になりやすいため、相手の意見やペースを第一に考える余裕を持つと良好な関係が保てます。", relationship: "中心的存在として人を惹きつけるカリスマ性があります。発言力があるゆえに圧迫感を与えないよう注意が必要です。謙虚さと思いやりを意識することで人望がより強固になります。" },
  { work: "全体を見渡し、組織のバランスを整える能力に優れています。総務や事務管理、各種コーディネーターなど、人と人、部署と部署をつなぐハブ的な役割で高い評価を得ます。", love: "相手の立場に立って細やかに支える包容力があります。安心感を第一に考えますが、尽くしすぎてお世話係にならないよう、互いに自立した対等な関係を心がけることが大切です。", relationship: "誰に対しても平等で親切なため、争い事を収める仲裁役として重宝されます。八方美人と思われないよう自分の軸をしっかり持ち、必要な時は断る強さを持つと吉です。" },
  { work: "高い直感力と情報収集能力を活かし、スピード感のある仕事で成果を上げます。IT・マスコミやコンサルタントなど、最新のトレンドや情報を整理して提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重しますが、理屈っぽくなりすぎず、素直な感情をオープンに示すと絆が一段と深まります。", relationship: "話題が豊富で人脈を作るのが非常に得意です。軽快な付き合いができますが、浅い関係で終わりやすいため、特定の人と深くじっくり向き合う時間も大切にすると評価が高まります。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーがあります。営業職や新規開拓、スポーツ・イベント関連など、自らアクティブに動いて結果を出す現場で活躍します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、相手のペースを無視して突っ走りすぎないよう、相手の感情に寄り添う落ち着きも必要です。", relationship: "明るくエネルギッシュで、周囲を鼓舞する存在です。親分肌で頼りになりますが、自分の意見を押し付けないよう配慮し、相手の事情を汲み取る柔軟性を持つと円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で才能が開花します。", love: "ロマンチックで情熱的な展開を好みます。人を惹きつける魅力がありますが、気分によって対応が変わりやすい面も。感情のコントロールを意識することで安定した愛が育めます。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなります。気分屋と思われないよう、誰に対しても分け隔てなく誠実で一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが安定感があります。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から高く評価されます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切です。" },
  { work: "既存の枠組みにとらわれず、新しい可能性を開拓する改革者です。ベンチャー企業や商品開発、新しいシステムの導入など、自由な発想で変化を起こす分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛を嫌うため、互いに自立し尊重し合える関係が理想的です。意固地にならず自分の素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを押し通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、人の悩みを聞き寄り添いながら解決へ導く職種で素晴らしい力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音や要望を言葉にして伝えるよう意識しましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼にされます。人の悩みを抱え込んで疲れやすいため、適切な境界線を保ち自分を癒やす時間を確保することが重要です。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括マネージャー、教育関連など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず二人で過ごす過程を楽しむ心のゆとりが絆を深めます。", relationship: "器が大きく、様々な人の意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、上手に周囲へ役割を振り分けることが円滑のコツです。" },
  { work: "純粋な熱意と集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度心を決めるとまっすぐに深く愛し続けます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、互いに一人の時間を尊重する適度な距離感を保つことが成功の鍵です。", relationship: "裏表がなく誠実で信頼されますが、こだわりが強くマイペースな一面もあります。自分の世界に閉じこもらず、周りの状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で力を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを持ちましょう。", relationship: "視野が広く、人の長所を発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を大切にすると人望が一層高まります。" },
  { work: "本質を見抜き、改善点を見つけ出す鋭い洞察力を持っています。品質管理やアナリスト、組織改革の提案など、問題点を明確にして立て直す仕事で大きな才能を発揮します。", love: "上辺だけではない本質的な信頼関係を求めます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく突きすぎないよう、温かい言葉を選ぶ優しさが欠かせません。", relationship: "嘘がなくオープンな付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に評価することで円滑な関係が維持できます。" },
  { work: "計画的で、目標達成に向けて着実に業務を遂行する力があります。プロジェクト管理や行政・財務など、規律と高い正確性が求められる環境で厚い信頼を得て活躍します。", love: "真面目で約束を守る信頼性の高いパートナーです。大きな安心感を与えますが、型にはまりすぎることがあるため、時にはサプライズや感情的な触れ合いを意識すると深まります。", relationship: "責任感が強く言動が安定しているため、周囲から頼りにされます。ルールに厳しくなりすぎず、相手の事情や失敗に対しても柔軟で寛容な姿勢で接すると人間関係がスムーズになります。" },
  { work: "高い美意識と感覚的な鋭さを活かせる分野で活躍します。芸術やデザイン、ファッション、美容関連など、美しい世界観やセンスを提供することで高い評価を獲得します。", love: "理想が高く、洗練されたロマンチックな関係を好みます。センスの合う相手と惹かれ合いますが、完璧を求めすぎず、ありのままを受け入れる心のゆとりを持つことが大切です。", relationship: "品があり魅力的な雰囲気で周囲を魅了します。自分のこだわりが強いため、批判に敏感になりやすい面も。他人の意見を柔軟に受け入れる大らかさを持つと楽になります。" },
  { work: "粘り強い信念と力強いパワーで困難を乗り越える強さがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し結果を出します。", love: "情熱的で一途な愛情を注ぐタイプです。障害があるほど燃え上がりますが、独占欲が強くなりすぎないよう注意が必要です。相手を信頼し自由を与える余裕が良好な関係を保ちます。", relationship: "意志が強く頼りになるため、困った時に頼られる存在です。自分の考えを押し通そうとすると摩擦が起きやすいため、周囲の意見によく耳を傾ける協調性が欠かせません。" },
  { work: "豊かな想像力とインスピレーションを形にする力があります。クリエイターや執筆業、心理カウンセリングなど、目に見えない感覚や内面を表現する仕事で真価を発揮します。", love: "言葉を超えた心と心の深い繋がりを重視します。非常にロマンチックですが、現実的な問題から目を背けがちな面も。日々の生活や現実的なコミュニケーションも大切にしましょう。", relationship: "感受性が豊かで人の痛みに寄り添える優しい人柄です。周りの雰囲気を察しすぎて疲れやすいため、適度に一人でリフレッシュする時間を持ち、自分のペースを守ることが大切です。" },
  { work: "自ら先頭に立って新しい道を切り開く開拓者です。新規事業や起業、プロジェクトの立ち上げなど、強い意志とスピード感を持ってゴールへ突き進む環境で実力を発揮します。", love: "互いに高め合える自立した関係を求めます。情熱的にアプローチしますが、主導権を握りたがる傾向があるため、相手のペースや価値観を尊重することを意識しましょう。", relationship: "堂々とした存在感で周囲を引っ張るリーダーです。ブレない軸を持ち頼りにされますが、頑固になりすぎず相手の意見を受け入れる柔軟性を持つとさらに人望が集まります。" },
  { work: "組織のバランスを整え、周囲を温かくサポートする役割が得意です。人事・労務や総務、接客業など、人と接し環境をスムーズに整える仕事で高い適性を発揮します。", love: "相手を深く包み込み、細やかに気を配る優しいパートナーです。自分の気持ちを抑え込んでストレスを溜めやすいため、日頃から素直な本音を話し合える関係を心がけましょう。", relationship: "穏やかで協調性があり、誰からも愛される平和主義者です。争いを避けるあまり自分を後回しにしがちなため、時には自分の意見をはっきり伝えることで信頼がより強固になります。" },
  { work: "アイデア豊富で明るいエネルギーを周囲に伝播させます。イベント企画や広報、エンターテインメント関連など、人を笑顔にし場を盛り上げる仕事で才能が開花します。", love: "一緒にいて退屈しない楽しく刺激的な関係を好みます。サービス精神旺盛ですが、気分屋な面が出ると相手を困惑させることも。誠実で一貫した対応を見せることが大切です。", relationship: "人懐っこくユーモアがあり、場の雰囲気を和ませる人気者です。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、より一層評価が高まります。" },
  { work: "一つの物事を深く追求し、専門性を高めていく職人タイプです。研究職やエンジニア、専門的な分析業務など、緻密さと探求心が求められる職種で素晴らしい成果を出します。", love: "慎重で一途なため、じっくりと時間をかけて深い絆を作ります。派手さはありませんが安定感抜群です。思いを溜め込まず、時には素直な好きという言葉を伝えることが重要です。", relationship: "落ち着きがあり誠実で、周囲に安心感を与えます。洞察力に優れていますが、納得いかないと心を閉ざしやすいため、自分と異なる考えも受け入れる寛容さを持ちましょう。" },
  { work: "組織の中心となって大勢を力強く牽引するリーダーシップがあります。経営者やマネージャーなど、大きな決断を下して全体をダイナミックに動かす環境で輝きます。", love: "頼りがいがあり、情熱的にパートナーを引っ張ります。自分の意見を通しすぎると威圧的になりやすいため、相手の気持ちやペースを尊重する心のゆとりを持つことが鍵です。", relationship: "存在感があり、自然と人が集まるカリスマ性を持っています。発言力があるゆえに強引に見えないよう注意し、謙虚な態度と思いやりを忘れないことで強い信頼を獲得できます。" },
  { work: "チーム全体の調和を保ち、円滑な運営を支える調整役です。総務や事務管理、福祉や地域活動など、人と人をつないで現場の土台をしっかり固める仕事に向いています。", love: "相手の立場に立って温かく支える優しい愛の持ち主です。安心感を重視しますが、過保護になりすぎないよう、お互いの自立を促す対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても親切で、揉め事を収めるのが得意な平和主義者です。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では断る強さを持つと関係が良好になります。" },
  { work: "直感力と情報収集能力が高く、スピーディーな環境で活躍します。IT・マスコミやコンサルティングなど、膨大な情報を整理・分析して新しい価値を生み出す仕事に適性があります。", love: "知的な会話や軽快なやり取りを楽しめる関係を求めます。お互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが得意なコミュニケーション上手です。浅く広い関係になりがちなため、信頼できる特定の相手とじっくり深い付き合いを育てる意識も大切です。" },
  { work: "強いエネルギーと目標達成意欲を持ち、現場を牽引します。営業職や新規事業の開拓、スポーツ関連など、自分の力でアクティブに結果を出していく環境で開花します。", love: "好きになったらまっすぐに思いを伝える情熱家です。一途ですが自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のポイントです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を汲み取る大らかさを意識しましょう。" },
  { work: "豊かな感性と華やかな魅力を持ち、人に感動を与える仕事に向いています。ブランディングや広報、芸術・デザインなど、自分のセンスを発揮して人を魅了する分野で活躍します。", love: "ロマンチックで情熱的な恋愛を好みます。人を引きつける力がありますが、感情の波が大きい傾向も。気分をコントロールし、安定した態度で接することが関係維持の秘訣です。", relationship: "華やかで場の中心になりやすい人気者です。気分屋と思われないよう、誰に対しても分け隔てなく誠実に対応することを心がけると、周囲からの信頼が一層揺るぎないものになります。" },
  { work: "アイデアを具体的な形へと落とし込む現実的な実行力があります。建設・製造や現場管理、企画の具体化など、着実に成果を作り上げていく業務で高い評価を得ます。", love: "誠実で約束をしっかり守る堅実なパートナーです。派手さはありませんが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも大切です。", relationship: "礼儀正しく責任感が強いため、目上からも後輩からも頼りにされます。ルールや形式にこだわりすぎると堅苦しく見えるため、柔軟性と大らかさを持って接すると吉です。" },
  { work: "常識に囚われない自由な発想で革新を起こすタイプです。ベンチャー企業での挑戦や企画開発など、新しい価値や仕組みを創造する分野で持ち前の感性を存分に発揮します。", love: "個性的で互いの自由を尊重し合える関係を好みます。縛られることを嫌うため、自立したパートナーシップが理想的です。意固地にならず素直な気持ちを伝えることが大切です。", relationship: "独自の信念があり、強い魅力を放つ存在です。自分のこだわりを無理に通そうとせず、周囲の意見にも柔軟に耳を傾ける協調性を意識することで良好な人間関係が長続きします。" },
  { work: "人の気持ちに寄り添う親身なサポートが得意です。カウンセラーや福祉・医療、相談窓口など、相手の抱える悩みを丁寧に聞き取り解決へと導く職種で高い適性を発揮します。", love: "相手の立場を最優先に考え、優しく尽くす包容力があります。自分を後回しにしがちなため、我慢を溜め込まず定期的に自分の本音や要望を言葉にして伝えるよう心がけましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼られます。他人の感情を引き受けすぎて疲弊しないよう、適度な距離感を保ち自分を大切にする時間も必要です。" },
  { work: "多様な要素を取りまとめ、プロジェクトを完成へ導く力があります。プロデューサーや統括管理職、教育分野など、全体の成果を集大成させるポジションで非凡な才能を見せます。", love: "深い包容力があり、パートナーを優しく見守る愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず、二人で過ごすプロセス自体を楽しむ余裕を持つと絆が深まります。", relationship: "器が大きく、様々な意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、周囲に上手に頼る姿勢を持つとより関係が円滑になります。" },
  { work: "純粋な熱意と高い集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度好きになった相手にはまっすぐ深い愛を注ぎます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、お互いに一人の時間を大切にする適度な距離感が成功の鍵です。", relationship: "裏表がなく誠実なため信用されますが、こだわりが強くマイペースになりがちな一面も。自分の世界に入り込みすぎず、周囲の状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、正しく導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で真価を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを心がけましょう。", relationship: "視野が広く、人の良いところを発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を第一にすると人望が一層高まります。" },
  { work: "物事の本質を見抜き、改善点を発見する鋭い洞察力を持っています。品質管理やアナリスト、組織改革のコンサルタントなど、問題点を明確にして立て直す仕事で才能を発揮します。", love: "上辺だけではない本質的な信頼関係を望みます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく指摘しすぎないよう、温かい言葉を選ぶ優しさが大切になります。", relationship: "嘘がなく誠実な付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に褒めることで、円滑な人間関係が維持できます。" },
  { work: "目標達成に向けて着実に計画を遂行する高い実行力があります。プロジェクト管理や行政・公務、財務など、規律と正確性が求められる職種で厚い信頼を得て活躍します。", love: "真面目で約束をしっかり守る信頼感抜群のパートナーです。大きな安心感を与えますが、型にはまりすぎることがあるため、時にはサプライズや感情的な触れ合いを意識すると深まります。", relationship: "責任感が強く言動が安定しているため、周囲から頼りにされます。ルールに厳しくなりすぎず、相手の都合や失敗に対しても柔軟で寛容な姿勢で接すると人間関係がスムーズになります。" },
  { work: "高い美意識と感覚的な鋭さを活かせる分野で活躍します。芸術やデザイン、ファッション、美容関連など、美しい世界観やセンスを提供することで高い評価を獲得します。", love: "理想が高く、ロマンチックで洗練された関係を好みます。センスの合う相手と惹かれ合いますが、相手に完璧を求めすぎず、ありのままを受け入れる心のゆとりを持つことが大切です。", relationship: "品があり魅力的な雰囲気で周囲を魅了します。自分のこだわりが強いため、批判に敏感になりやすい面も。他人の意見を柔軟に受け入れる大らかさを持つと楽になります。" },
  { work: "粘り強い信念と力強いパワーで困難を乗り越える強さがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し成果を勝ち取ります。", love: "情熱的で一途な愛情を注ぐタイプです。障害があるほど燃え上がりますが、独占欲が強くなりすぎないよう注意が必要です。相手を信頼し自由を与える余裕を持つと良好な関係が保てます。", relationship: "意志が強く頼りになるため、ピンチの時に頼られる存在です。自分の考えを押し通そうとすると摩擦が起きやすいため、周囲の意見によく耳を傾ける協調性が欠かせません。" },
  { work: "豊かな想像力とインスピレーションを形にする力があります。クリエイターや執筆業、心理カウンセリングなど、目に見えない感覚や内面を表現する仕事で真価を発揮します。", love: "言葉を超えた心と心の深い繋がりを重視します。とてもロマンチックですが現実感に欠けがちな面も。理想ばかりを追わず、日々の生活や現実的なコミュニケーションも大切にしましょう。", relationship: "感受性が豊かで人の痛みに寄り添える優しい人柄です。周りの雰囲気を察しすぎて疲れやすいため、適度に一人でリフレッシュする時間を持ち、自分のペースを守ることが大切です。" },
  { work: "強い信念と先見の明を持ち、プロジェクトを力強く推進します。起業家や組織のリーダー、企画開発など、目標に向かってブレずに道を開拓していく分野で真価を発揮します。", love: "情熱的で、互いに高め合える自立した関係を好みます。主導権を握りたがる傾向があるため、自分のペースを押し付けず、相手の価値観や意見を尊重する姿勢を持つと円満になります。", relationship: "堂々とした立ち振る舞いで頼りにされるリーダータイプです。意志が強くブレない反面、頑固になりやすいため、周囲の意見を柔軟に聞き入れる姿勢を意識することが大切です。" },
  { work: "細やかな気配りと優れた調整能力で、チームの環境を整える役割に優れています。総務や人事、接客・サービス業など、人をサポートし現場を支える仕事に適性があります。", love: "相手を包み込むような温かい優しさを持つ誠実なパートナーです。相手に気を使いすぎてストレスを溜めやすいため、素直な気持ちや本音を話し合える関係作りが欠かせません。", relationship: "穏やかで協調性が高く、周囲に安心感を与える平和主義者です。揉め事を避けるあまり自分の意見を飲み込みがちなため、時には自分の意志を伝える勇気を持つと信頼が深まります。" },
  { work: "アイデアが豊富で、人を喜ばせる企画やイベントの打ち出しが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で活躍します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神旺盛ですが、気分屋な面が出ると相手を困惑させることも。感情を一定に保ち、誠意を示すことが長続きの鍵です。", relationship: "明るくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな約束にならないよう注意すると、さらに信頼性が増します。" },
  { work: "探究心が強く、専門分野の知識や技術を深く掘り下げる仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で大きな成果を出します。", love: "慎重で一途な恋愛傾向があり、じっくりと時間をかけて信頼関係を築きます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着いていて誠実なため、聞き手として厚い信頼を得ます。洞察力がありますが、納得いかないと頑固になりがちなため、異なる価値観を受け入れる柔軟性を持つと広がります。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら決断を下して組織を大きく動かすポジションで実力を発揮します。", love: "頼りがいがあり、パートナーをぐいぐい引っ張っていくタイプです。情熱的ですが強引になりやすいため、相手の意見やペースを第一に考える余裕を持つと良好な関係が保てます。", relationship: "中心的存在として人を惹きつけるカリスマ性があります。発言力があるゆえに圧迫感を与えないよう注意が必要です。謙虚さと思いやりを意識することで人望がより強固になります。" },
  { work: "全体を見渡し、組織のバランスを整える能力に優れています。総務や事務管理、各種コーディネーターなど、人と人、部署と部署をつなぐハブ的な役割で高い評価を得ます。", love: "相手の立場に立って細やかに支える包容力があります。安心感を第一に考えますが、尽くしすぎてお世話係にならないよう、互いに自立した対等な関係を心がけることが大切です。", relationship: "誰に対しても平等で親切なため、争い事を収める仲裁役として重宝されます。八方美人と思われないよう自分の軸をしっかり持ち、必要な時は断る強さを持つと吉です。" },
  { work: "高い直感力と情報収集能力を活かし、スピード感のある仕事で成果を上げます。IT・マスコミやコンサルタントなど、最新のトレンドや情報を整理して提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重しますが、理屈っぽくなりすぎず、素直な感情をオープンに示すと絆が一段と深まります。", relationship: "話題が豊富で人脈を作るのが非常に得意です。軽快な付き合いができますが、浅い関係で終わりやすいため、特定の人と深くじっくり向き合う時間も大切にすると評価が高まります。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーがあります。営業職や新規開拓、スポーツ・イベント関連など、自らアクティブに動いて結果を出す現場で活躍します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、相手のペースを無視して突っ走りすぎないよう、相手の感情に寄り添う落ち着きも必要です。", relationship: "周囲を明るく鼓舞する存在です。親分肌で頼りになりますが、自分の意見を押し付けないよう配慮し、相手の事情を汲み取る柔軟性を持つと円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で才能が開花します。", love: "ロマンチックで情熱的な展開を好みます。人を惹きつける魅力がありますが、気分によって対応が変わりやすい面も。感情のコントロールを意識することで安定した愛が育めます。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなります。気分屋と思われないよう、誰に対しても分け隔てなく誠実で一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが安定感があります。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から高く評価されます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切です。" },
  { work: "現状に満足せず新しい可能性を開拓する改革者です。ベンチャー企業や商品開発、新システムの導入など、自由な発想で変化を起こす分野で個性を存分に発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛を嫌うため、互いに自立し尊重し合える関係が理想的です。意固地にならず自分の素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを押し通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },

  { work: "粘り強い信念と力強いパワーで困難を乗り越える強さがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し結果を出します。", love: "情熱的で一途な愛情を注ぐタイプです。障害があるほど燃え上がりますが、独占欲が強くなりすぎないよう注意が必要です。相手を信頼し自由を与える余裕が良好な関係を保ちます。", relationship: "意志が強く頼りになるため、困った時に頼られる存在です。自分の考えを押し通そうとすると摩擦が起きやすいため、周囲の意見によく耳を傾ける協調性が欠かせません。" },
  { work: "豊かな想像力とインスピレーションを形にする力があります。クリエイターや執筆業、心理カウンセリングなど、目に見えない感覚や内面を表現する仕事で真価を発揮します。", love: "言葉を超えた心と心の深い繋がりを重視します。非常にロマンチックですが、現実的な問題から目を背けがちな面も。日々の生活や現実的なコミュニケーションも大切にしましょう。", relationship: "感受性が豊かで人の痛みに寄り添える優しい人柄です。周りの雰囲気を察しすぎて疲れやすいため、適度に一人でリフレッシュする時間を持ち、自分のペースを守ることが大切です。" },
  { work: "先見の明と強い行動力を併せ持ち、ゼロから事業やプロジェクトを力強く立ち上げる能力に長けています。起業家やディレクターなど、自ら先頭に立って道を開拓していく環境で才能を発揮します。", love: "情熱的で、お互いに成長し合える自立したパートナーシップを好みます。主導権を握りたがる傾向があるため、相手の意見やペースを尊重し、耳を傾ける余裕を持つと関係が円滑になります。", relationship: "ブレない芯を持ち、堂々とした立ち振る舞いで周囲から頼りにされるリーダータイプです。頑固になりすぎず、相手の意見を柔軟に受け入れる姿勢を意識することで人望がより一層高まります。" },
  { work: "細やかな心配りと優れた調整能力を活かし、組織やチームの環境を整える役割に長けています。総務や人事、接客・サービス業など、人をサポートし現場を裏から支える仕事に適性があります。", love: "相手を包み込むような温かい優しさを持つ誠実なパートナーです。相手に気を使いすぎてストレスを溜めやすいため、日頃から素直な気持ちや本音を話し合える関係作りが欠かせません。", relationship: "穏やかで協調性が高く、周囲に安心感を与える平和主義者です。揉め事を避けるあまり自分の意見を後回しにしがちなため、時には自分の意思をしっかり伝えることで真の信頼が得られます。" },
  { work: "アイデアが豊富で、人を喜ばせる企画やイベントを打ち出すのが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で実力を発揮します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神が旺盛ですが、気分屋な面が出ると相手を困惑させることも。感情を一定に保ち、誠意を示すことが関係長続きの鍵です。", relationship: "人懐っこくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、さらに信頼性が増します。" },
  { work: "探究心が非常に強く、専門分野の知識や技術を深めていく仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で素晴らしい成果を出します。", love: "慎重で一途な恋愛傾向があり、時間をかけてゆっくりと信頼関係を築いていきます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着きがあり誠実なため、聞き手として周囲から厚い信頼を得ます。洞察力がありますが、納得いかないと心を閉ざしやすいため、自分と異なる価値観を受け入れる柔軟性を持ちましょう。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら重要な決断を下して組織を大きく動かすポジションで真価を発揮します。", love: "頼りがいがあり、パートナーを力強く引っぱっていくタイプです。情熱的ですが自分の思い通りに動かそうとしやすいため、相手の気持ちやペースを尊重する心の余裕を持つことが大切です。", relationship: "中心的存在として人を引きつけるカリスマ性を持っています。発言力があるゆえに威圧的にならないよう注意が必要です。謙虚さと思いやりを忘れないことで人望が不動のものになります。" },
  { work: "全体を見渡し、組織のバランスを円滑に整える能力に優れています。総務や事務管理、仲介業など、人と人、部署と部署をつないで現場の土台をしっかり固める仕事で高い評価を得ます。", love: "相手の立場に立って細やかに支える包容力のあるパートナーです。安心感を第一に考えますが、過保護になりすぎないよう、お互いに自立した対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても平等で親切なため、揉め事を収める仲裁役として重宝されます。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では毅然と断る強さを持つと吉です。" },
  { work: "鋭い直感力と情報収集能力を活かし、スピード感のある環境で成果を上げます。IT・マスコミやコンサルタントなど、膨大な情報を整理・分析して新しい価値を提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが非常に得意なタイプです。軽快な付き合いができますが、浅い関係で終わりがちなため、信頼できる特定の相手と深く向き合う時間も大切にしましょう。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーを持っています。営業職や新規開拓、スポーツ関連など、自らアクティブに動いて結果を出す現場で才能が開花します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のコツです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を配慮する大らかさを意識すると円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で高い適性を発揮します。", love: "ロマンチックでドラマチックな展開を好みます。人を惹きつける魅力がありますが、感情の波が大きい面も。気分をコントロールし、誠実な態度を貫くことが安定した愛に繋がります。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなる人気者です。気分屋と思われるのを防ぐため、誰に対しても分け隔てなく一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から一目置かれます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切になります。" },
  { work: "常識にとらわれない独自の視点で革新を起こす改革者です。ベンチャー企業での挑戦や商品開発、新しいシステムの導入など、自由な発想で変化を生み出す分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛されることを嫌うため、互いに自立し尊重し合える関係が理想的です。頑固にならず素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを無理に通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、人の悩みを聞き寄り添いながら解決へ導く職種で素晴らしい力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音や要望を言葉にして伝えるよう意識しましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼られます。人の悩みを抱え込んで疲れやすいため、適切な境界線を保ち自分を癒やす時間を確保することが重要です。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括マネージャー、教育関連など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず二人で過ごす過程を楽しむ心のゆとりが絆を深めます。", relationship: "器が大きく、様々な人の意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、上手に周囲へ役割を振り分けることが円滑のコツです。" },
  { work: "純粋な熱意と集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度心を決めるとまっすぐに深く愛し続けます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、互いに一人の時間を尊重する適度な距離感を保つことが成功の鍵です。", relationship: "裏表がなく誠実で信頼されますが、こだわりが強くマイペースな一面もあります。自分の世界に閉じこもらず、周りの状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で力を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを持ちましょう。", relationship: "視野が広く、人の長所を発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を大切にすると人望が一層高まります。" },
  { work: "本質を見抜き、改善点を見つけ出す鋭い洞察力を持っています。品質管理やアナリスト、組織改革の提案など、問題点を明確にして立て直す仕事で大きな才能を発揮します。", love: "上辺だけではない本質的な信頼関係を求めます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく突きすぎないよう、温かい言葉を選ぶ優しさが欠かせません。", relationship: "嘘がなくオープンな付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に評価することで円滑な関係が維持できます。" },

  { work: "一つの物事を深く追求し、専門性を高めていく職人タイプです。研究職やエンジニア、専門的な分析業務など、緻密さと探求心が求められる職種で素晴らしい成果を出します。", love: "慎重で一途なため、じっくりと時間をかけて深い絆を作ります。派手さはありませんが安定感抜群です。思いを溜め込まず、時には素直な好きという言葉を伝えることが重要です。", relationship: "落ち着きがあり誠実で、周囲に安心感を与えます。洞察力に優れていますが、納得いかないと心を閉ざしやすいため、自分と異なる考えも受け入れる寛容さを持ちましょう。" },

  { work: "チーム全体の調和を保ち、円滑な運営を支える調整役です。総務や事務管理、福祉や地域活動など、人と人をつないで現場の土台をしっかり固める仕事に向いています。", love: "相手の立場に立って温かく支える優しい愛の持ち主です。安心感を重視しますが、過保護になりすぎないよう、お互いの自立を促す対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても親切で、揉め事を収めるのが得意な平和主義者です。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では断る強さを持つと関係が良好になります。" },
  { work: "直感力と情報収集能力が高く、スピーディーな環境で活躍します。IT・マスコミやコンサルティングなど、膨大な情報を整理・分析して新しい価値を生み出す仕事に適性があります。", love: "知的な会話や軽快なやり取りを楽しめる関係を求めます。お互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが得意なコミュニケーション上手です。浅く広い関係になりがちなため、信頼できる特定の相手とじっくり深い付き合いを育てる意識も大切です。" },
  { work: "強いエネルギーと目標達成意欲を持ち、現場を牽引します。営業職や新規事業の開拓、スポーツ関連など、自分の力でアクティブに結果を出していく環境で開花します。", love: "好きになったらまっすぐに思いを伝える情熱家です。一途ですが自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のポイントです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を汲み取る大らかさを意識しましょう。" },
  { work: "豊かな感性と華やかな魅力を持ち、人に感動を与える仕事に向いています。ブランディングや広報、芸術・デザインなど、自分のセンスを発揮して人を魅了する分野で活躍します。", love: "ロマンチックで情熱的な恋愛を好みます。人を引きつける力がありますが、感情の波が大きい傾向も。気分をコントロールし、安定した態度で接することが関係維持の秘訣です。", relationship: "華やかで場の中心になりやすい人気者です。気分屋と思われないよう、誰に対しても分け隔てなく誠実に対応することを心がけると、周囲からの信頼が一層揺るぎないものになります。" },
  { work: "アイデアを具体的な形へと落とし込む現実的な実行力があります。建設・製造や現場管理、企画の具体化など、着実に成果を作り上げていく業務で高い評価を得ます。", love: "誠実で約束をしっかり守る堅実なパートナーです。派手さはありませんが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも大切です。", relationship: "礼儀正しく責任感が強いため、目上からも後輩からも頼りにされます。ルールや形式にこだわりすぎると堅苦しく見えるため、柔軟性と大らかさを持って接すると吉です。" },
  { work: "先見の明と強い決断力を持ち、新規事業やプロジェクトを牽引する力があります。起業家やディレクターなど、自ら道を切り開く分野で真価を発揮します。", love: "情熱的で、互いに切磋琢磨できる対等な関係を好みます。主導権を握りたがる傾向があるため、相手の価値観やペースを尊重する柔軟性を持つと円満になります。", relationship: "堂々とした存在感があり、周囲から頼りにされるリーダーです。自分の考えを押し通そうとせず、周囲の意見を素直に聞き入れることで人望がより一層高まります。" },
  { work: "細やかな心配りと高い調整能力を活かし、チームの環境作りに貢献します。総務や人事、サポート業務全般など、人を支える役割で強い適性を発揮します。", love: "包容力があり、相手を温かく支える誠実なパートナーです。気を使すぎて本音を抑え込みがちなため、定期的に自分の気持ちを素直に打ち明けることが大切です。", relationship: "穏やかで協調性があり、周囲に安心感を与える平和主義者です。揉め事を避けるあまり八方美人にならないよう、自分の軸をしっかり持つと信頼が強固になります。" },
  { work: "アイデアが豊富で、人を楽しませる企画やイベントの立ち上げが得意です。広報やエンターテインメント関連など、場を活性化させる仕事で活躍します。", love: "明るく楽しく過ごせる刺激的な関係を求めます。サービス精神が旺盛ですが、気分屋な面が出ると誤解を招くことも。誠意ある態度を貫くことが長続きの鍵です。", relationship: "フレンドリーで親しみやすく、場の雰囲気を一瞬で和ませる魅力があります。軽はずみな約束や発言に気をつけることで、より深い信頼関係を築くことができます。" },
  { work: "高い探究心を持ち、専門的な知識や技術を突き詰める仕事に向いています。研究職やエンジニアなど、妥協せずに精度を高めていく職種で大きな成果を残します。", love: "慎重で一途な恋愛傾向があり、時間をかけて信頼を育みます。派手さはありませんが安定感があり、時には素直な好きという感情を言葉に表すと吉です。", relationship: "落ち着きがあり誠実なため、聞き手として頼りにされます。洞察力がありますが、自分の考えに固執しすぎず、多様な価値観を受け入れる寛容さが大切です。" },

  { work: "既存の枠組みにとらわれず新しい可能性を開拓する改革者です。ベンチャー企業での挑戦や企画開発など、自由な発想で変化を起こす分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛を嫌うため、互いに自立し尊重し合える関係が理想的です。素直な気持ちを伝えることを意識しましょう。", relationship: "強い信念を持ち独特の魅力を放ちます。自分のこだわりを無理に通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで関係が良好に保てます。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、悩みを聞き親身に対応する職種で力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音を言葉にして伝えるよう心がけましょう。", relationship: "穏やかで聞き上手なため、多くの人から頼りにされます。他人の感情を引き受けすぎて疲弊しないよう、適切な境界線を保ち自分を癒やす時間を確保しましょう。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括管理職など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。結論を急ぎすぎず、二人で過ごすプロセス自体を楽しむ余裕を持つと絆が深まります。", relationship: "器が大きく、様々な意見を取りまとめて統合できます。頼られることが多い反面、一人で抱え込みやすいため、周囲に上手に頼る姿勢を持つことが円滑のコツです。" },

  { work: "本質を見抜き、改善点を見つけ出す鋭い洞察力を持っています。品質管理やアナリストなど、問題点を明確にして立て直す仕事で大きな才能を発揮します。", love: "上辺だけではない本質的な信頼関係を求めます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく突きすぎない温かい言葉選びが大切です。", relationship: "嘘がなく誠実な付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に評価すると円滑になります。" },

  { work: "組織の中心となって大勢を力強く牽引するリーダーシップがあります。経営者やマネージャーなど、大きな決断を下して全体を動かす環境で輝きます。", love: "頼りがいがあり情熱的にパートナーを引っ張ります。自分の意見を通しすぎると威圧的になりやすいため、相手の気持ちを尊重するゆとりを持ちましょう。", relationship: "存在感があり自然と人が集まるカリスマ性を持っています。強引に見えないよう注意し、謙虚な態度と思いやりを忘れないことで強い信頼を獲得できます。" },
  { work: "チーム全体の調和を保ち円滑な運営を支える調整役です。総務や事務管理、福祉や地域活動など、人と人をつないで土台をしっかり固める仕事に向いています。", love: "相手の立場に立って温かく支える優しい愛の持ち主です。安心感を重視しますが、過保護になりすぎないよう、お互いに自立した対等な距離感を保ちましょう。", relationship: "誰に対しても親切で揉め事を収めるのが得意です。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では断る強さを持つと円満になります。" },
  { work: "直感力と情報収集能力が高くスピーディーな環境で活躍します。IT・マスコミやコンサルティングなど、情報を整理・分析して新しい価値を生む仕事に向いています。", love: "知的な会話や軽快なやり取りを楽しめる関係を求めます。お互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが得意なコミュニケーション上手です。浅く広い関係になりがちなため、信頼できる特定の相手と深く付き合う意識も大切です。" },
  { work: "強いエネルギーと目標達成意欲を持ち現場を牽引します。営業職や新規事業の開拓、スポーツ関連など、自らアクティブに結果を出す環境で開花します。", love: "好きになったらまっすぐに思いを伝える情熱家です。一途ですが自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持ちましょう。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を汲み取る大らかさを意識しましょう。" },
  { work: "豊かな感性と華やかな魅力を持ち人に感動を与える仕事に向いています。ブランディングや広報、芸術・デザインなど、センスを発揮して人を魅了する分野で活躍します。", love: "ロマンチックで情熱的な恋愛を好みます。人を引きつける力がありますが感情の波が大きい傾向も。気分をコントロールし安定した態度で接することが秘訣です。", relationship: "華やかで場の中心になりやすい人気者です。気分屋と思われないよう、誰に対しても分け隔てなく誠実に対応することを心がけると信頼が揺るぎないものになります。" },
  { work: "アイデアを具体的な形へと落とし込む現実的な実行力があります。建設・製造や現場管理、企画の具体化など、着実に成果を作り上げていく業務で高い評価を得ます。", love: "誠実で約束をしっかり守る堅実なパートナーです。派手さはありませんが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えましょう。", relationship: "礼儀正しく責任感が強いため頼りにされます。ルールや形式にこだわりすぎると堅苦しく見えるため、柔軟性と大らかさを持って接すると人間関係がスムーズです。" },
  { work: "先見の明と高い実行力を持ち、新しいプロジェクトや事業を力強く立ち上げる能力があります。起業家やプロジェクトリーダーなど、自ら先頭に立って道を開拓していく分野で真価を発揮します。", love: "情熱的で、お互いに切磋琢磨できる対等で自立した関係を好みます。主導権を握りがちになるため、相手のペースや価値観を尊重する寛容さを持つと円満な関係が長く続きます。", relationship: "堂々とした立ち振る舞いで頼りにされるリーダータイプです。意志が強くブレない反面、頑固になりやすいため、周囲の意見を柔軟に聞き入れる姿勢を意識することが大切です。" },
  { work: "細やかな気配りと優れた調整能力で、組織やチームの環境を整える役割に優れています。総務や人事、接客・サービス業など、人をサポートし現場を支える仕事に適性があります。", love: "相手を包み込むような温かい優しさを持つ誠実なパートナーです。相手に気を使いすぎてストレスを溜めやすいため、素直な気持ちや本音を話し合える関係作りが欠かせません。", relationship: "穏やかで協調性が高く、周囲に安心感を与える平和主義者です。揉め事を避けるあまり自分の意見を飲み込みがちなため、時には自分の意志を伝える勇気を持つと信頼が深まります。" },
  { work: "アイデアが豊富で、人を喜ばせる企画やイベントの打ち出しが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で活躍します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神旺盛ですが、気分屋な面が出ると相手を困惑させることも。感情を一定に保ち、誠意を示すことが長続きの鍵です。", relationship: "明るくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな約束にならないよう注意すると、さらに信頼性が増します。" },
  { work: "探究心が強く、専門分野の知識や技術を深く掘り下げる仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で大きな成果を出します。", love: "慎重で一途な恋愛傾向があり、じっくりと時間をかけて信頼関係を築きます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着いていて誠実なため、聞き手として厚い信頼を得ます。洞察力がありますが、納得いかないと頑固になりがちなため、異なる価値観を受け入れる柔軟性を持つと広がります。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら決断を下して組織を大きく動かすポジションで実力を発揮します。", love: "頼りがいがあり、パートナーをぐいぐい引っ張っていくタイプです。情熱的ですが強引になりやすいため、相手の意見やペースを第一に考える余裕を持つと良好な関係が保てます。", relationship: "中心的存在として人を惹きつけるカリスマ性があります。発言力があるゆえに圧迫感を与えないよう注意が必要です。謙虚さと思いやりを意識することで人望がより強固になります。" },
  { work: "全体を見渡し、組織のバランスを整える能力に優れています。総務や事務管理、各種コーディネーターなど、人と人、部署と部署をつなぐハブ的な役割で高い評価を得ます。", love: "相手の立場に立って細やかに支える包容力があります。安心感を第一に考えますが、尽くしすぎてお世話係にならないよう、互いに自立した対等な関係を心がけることが大切です。", relationship: "誰に対しても平等で親切なため、争い事を収める仲裁役として重宝されます。八方美人と思われないよう自分の軸をしっかり持ち、必要な時は断る強さを持つと吉です。" },
  { work: "高い直感力と情報収集能力を活かし、スピード感のある仕事で成果を上げます。IT・マスコミやコンサルタントなど、最新のトレンドや情報を整理して提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重しますが、理屈っぽくなりすぎず、素直な感情をオープンに示すと絆が一段と深まります。", relationship: "話題が豊富で人脈を作るのが非常に得意です。軽快な付き合いができますが、浅い関係で終わりやすいため、特定の人と深くじっくり向き合う時間も大切にすると評価が高まります。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーがあります。営業職や新規開拓、スポーツ・イベント関連など、自らアクティブに動いて結果を出す現場で活躍します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、相手のペースを無視して突っ走りすぎないよう、相手の感情に寄り添う落ち着きも必要です。", relationship: "周囲を明るく鼓舞する存在です。親分肌で頼りになりますが、自分の意見を押し付けないよう配慮し、相手の事情を汲み取る柔軟性を持つと円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で才能が開花します。", love: "ロマンチックで情熱的な展開を好みます。人を惹きつける魅力がありますが、気分によって対応が変わりやすい面も。感情のコントロールを意識することで安定した愛が育めます。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなります。気分屋と思われないよう、誰に対しても分け隔てなく誠実で一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが安定感があります。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から高く評価されます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切です。" },
  { work: "既存の枠組みにとらわれず、新しい可能性を開拓する改革者です。ベンチャー企業や商品開発、新しいシステムの導入など、自由な発想で変化を起こす分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛を嫌うため、互いに自立し尊重し合える関係が理想的です。意固地にならず自分の素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを押し通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、人の悩みを聞き寄り添いながら解決へ導く職種で素晴らしい力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音や要望を言葉にして伝えるよう意識しましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼にされます。人の悩みを抱え込んで疲れやすいため、適切な境界線を保ち自分を癒やす時間を確保することが重要です。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括マネージャー、教育関連など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず二人で過ごす過程を楽しむ心のゆとりが絆を深めます。", relationship: "器が大きく、様々な人の意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、上手に周囲へ役割を振り分けることが円滑のコツです。" },
  { work: "純粋な熱意と集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度心を決めるとまっすぐに深く愛し続けます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、互いに一人の時間を尊重する適度な距離感を保つことが成功の鍵です。", relationship: "裏表がなく誠実で信頼されますが、こだわりが強くマイペースな一面もあります。自分の世界に閉じこもらず、周りの状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で力を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを持ちましょう。", relationship: "視野が広く、人の長所を発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を大切にすると人望が一層高まります。" },
  { work: "本質を見抜き、改善点を見つけ出す鋭い洞察力を持っています。品質管理やアナリスト、組織改革の提案など、問題点を明確にして立て直す仕事で大きな才能を発揮します。", love: "上辺だけではない本質的な信頼関係を求めます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく突きすぎないよう、温かい言葉を選ぶ優しさが欠かせません。", relationship: "嘘がなくオープンな付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に評価することで円滑な関係が維持できます。" },
  { work: "計画的で、目標達成に向けて着実に業務を遂行する力があります。プロジェクト管理や行政・財務など、規律と高い正確性が求められる環境で厚い信頼を得て活躍します。", love: "真面目で約束を守る信頼性の高いパートナーです。大きな安心感を与えますが、型にはまりすぎることがあるため、時にはサプライズや感情的な触れ合いを意識すると深まります。", relationship: "責任感が強く言動が安定しているため、周囲から頼りにされます。ルールに厳しくなりすぎず、相手の事情や失敗に対しても柔軟で寛容な姿勢で接すると人間関係がスムーズになります。" },
  { work: "高い美意識と感覚的な鋭さを活かせる分野で活躍します。芸術やデザイン、ファッション、美容関連など、美しい世界観やセンスを提供することで高い評価を獲得します。", love: "理想が高く、洗練されたロマンチックな関係を好みます。センスの合う相手と惹かれ合いますが、完璧を求めすぎず、ありのままを受け入れる心のゆとりを持つことが大切です。", relationship: "品があり魅力的な雰囲気で周囲を魅了します。自分のこだわりが強いため、批判に敏感になりやすい面も。他人の意見を柔軟に受け入れる大らかさを持つと楽になります。" },
  { work: "粘り強い信念と力強いパワーで困難を乗り越える強さがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し結果を出します。", love: "情熱的で一途な愛情を注ぐタイプです。障害があるほど燃え上がりますが、独占欲が強くなりすぎないよう注意が必要です。相手を信頼し自由を与える余裕が良好な関係を保ちます。", relationship: "意志が強く頼りになるため、困った時に頼られる存在です。自分の考えを押し通そうとすると摩擦が起きやすいため、周囲の意見によく耳を傾ける協調性が欠かせません。" },
  { work: "豊かな想像力とインスピレーションを形にする力があります。クリエイターや執筆業、心理カウンセリングなど、目に見えない感覚や内面を表現する仕事で真価を発揮します。", love: "言葉を超えた心と心の深い繋がりを重視します。非常にロマンチックですが、現実的な問題から目を背けがちな面も。日々の生活や現実的なコミュニケーションも大切にしましょう。", relationship: "感受性が豊かで人の痛みに寄り添える優しい人柄です。周りの雰囲気を察しすぎて疲れやすいため、適度に一人でリフレッシュする時間を持ち、自分のペースを守ることが大切です。" },
  { work: "自ら先頭に立って新しい道を切り開く開拓者です。新規事業や起業、プロジェクトの立ち上げなど、強い意志とスピード感を持ってゴールへ突き進む環境で実力を発揮します。", love: "互いに高め合える自立した関係を求めます。情熱的にアプローチしますが、主導権を握りたがる傾向があるため、相手のペースや価値観を尊重することを意識しましょう。", relationship: "堂々とした存在感で周囲を引っ張るリーダーです。ブレない軸を持ち頼りにされますが、頑固になりすぎず相手の意見を受け入れる柔軟性を持つとさらに人望が集まります。" },
  { work: "組織のバランスを整え、周囲を温かくサポートする役割が得意です。人事・労務や総務、接客業など、人と接し環境をスムーズに整える仕事で高い適性を発揮します。", love: "相手を深く包み込み、細やかに気を配る優しいパートナーです。自分の気持ちを抑え込んでストレスを溜めやすいため、日頃から素直な本音を話し合える関係を心がけましょう。", relationship: "穏やかで協調性があり、誰からも愛される平和主義者です。争いを避けるあまり自分を後回しにしがちなため、時には自分の意見をはっきり伝えることで信頼がより強固になります。" },
  { work: "アイデア豊富で明るいエネルギーを周囲に伝播させます。イベント企画や広報、エンターテインメント関連など、人を笑顔にし場を盛り上げる仕事で才能が開花します。", love: "一緒にいて退屈しない楽しく刺激的な関係を好みます。サービス精神旺盛ですが、気分屋な面が出ると相手を困惑させることも。誠実で一貫した対応を見せることが大切です。", relationship: "人懐っこくユーモアがあり、場の雰囲気を和ませる人気者です。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、より一層評価が高まります。" },
  { work: "一つの物事を深く追求し、専門性を高めていく職人タイプです。研究職やエンジニア、専門的な分析業務など、緻密さと探求心が求められる職種で素晴らしい成果を出します。", love: "慎重で一途なため、じっくりと時間をかけて深い絆を作ります。派手さはありませんが安定感抜群です。思いを溜め込まず、時には素直な好きという言葉を伝えることが重要です。", relationship: "落ち着きがあり誠実で、周囲に安心感を与えます。洞察力に優れていますが、納得いかないと心を閉ざしやすいため、自分と異なる考えも受け入れる寛容さを持ちましょう。" },
  { work: "組織の中心となって大勢を力強く牽引するリーダーシップがあります。経営者やマネージャーなど、大きな決断を下して全体をダイナミックに動かす環境で輝きます。", love: "頼りがいがあり、情熱的にパートナーを引っ張ります。自分の意見を通しすぎると威圧的になりやすいため、相手の気持ちやペースを尊重する心のゆとりを持つことが鍵です。", relationship: "存在感があり、自然と人が集まるカリスマ性を持っています。発言力があるゆえに強引に見えないよう注意し、謙虚な態度と思いやりを忘れないことで強い信頼を獲得できます。" },
  { work: "チーム全体の調和を保ち、円滑な運営を支える調整役です。総務や事務管理、福祉や地域活動など、人と人をつないで現場の土台をしっかり固める仕事に向いています。", love: "相手の立場に立って温かく支える優しい愛の持ち主です。安心感を重視しますが、過保護になりすぎないよう、お互いの自立を促す対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても親切で、揉め事を収めるのが得意な平和主義者です。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では断る強さを持つと関係が良好になります。" },
  { work: "直感力と情報収集能力が高く、スピーディーな環境で活躍します。IT・マスコミやコンサルティングなど、膨大な情報を整理・分析して新しい価値を生み出す仕事に適性があります。", love: "知的な会話や軽快なやり取りを楽しめる関係を求めます。お互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが得意なコミュニケーション上手です。浅く広い関係になりがちなため、信頼できる特定の相手とじっくり深い付き合いを育てる意識も大切です。" },
  { work: "強いエネルギーと目標達成意欲を持ち、現場を牽引します。営業職や新規事業の開拓、スポーツ関連など、自分の力でアクティブに結果を出していく環境で開花します。", love: "好きになったらまっすぐに思いを伝える情熱家です。一途ですが自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のポイントです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を汲み取る大らかさを意識しましょう。" },
  { work: "豊かな感性と華やかな魅力を持ち、人に感動を与える仕事に向いています。ブランディングや広報、芸術・デザインなど、自分のセンスを発揮して人を魅了する分野で活躍します。", love: "ロマンチックで情熱的な恋愛を好みます。人を引きつける力がありますが、感情の波が大きい傾向も。気分をコントロールし、安定した態度で接することが関係維持の秘訣です。", relationship: "華やかで場の中心になりやすい人気者です。気分屋と思われないよう、誰に対しても分け隔てなく誠実に対応することを心がけると、周囲からの信頼が一層揺るぎないものになります。" },
  { work: "アイデアを具体的な形へと落とし込む現実的な実行力があります。建設・製造や現場管理、企画の具体化など、着実に成果を作り上げていく業務で高い評価を得ます。", love: "誠実で約束をしっかり守る堅実なパートナーです。派手さはありませんが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも大切です。", relationship: "礼儀正しく責任感が強いため、目上からも後輩からも頼りにされます。ルールや形式にこだわりすぎると堅苦しく見えるため、柔軟性と大らかさを持って接すると吉です。" },
  { work: "先見の明と強い行動力を併せ持ち、ゼロから事業やプロジェクトを力強く立ち上げる能力に長けています。起業家やディレクターなど、自ら先頭に立って道を開拓していく環境で才能を発揮します。", love: "情熱的で、お互いに成長し合える自立したパートナーシップを好みます。主導権を握りたがる傾向があるため、相手の意見やペースを尊重し、耳を傾ける余裕を持つと関係が円滑になります。", relationship: "ブレない芯を持ち、堂々とした立ち振る舞いで周囲から頼りにされるリーダータイプです。頑固になりすぎず、相手の意見を柔軟に受け入れる姿勢を意識することで人望がより一層高まります。" },
  { work: "細やかな心配りと優れた調整能力を活かし、組織やチームの環境を整える役割に長けています。総務や人事、接客・サービス業など、人をサポートし現場を裏から支える仕事に適性があります。", love: "相手を包み込むような温かい優しさを持つ誠実なパートナーです。相手に気を使いすぎてストレスを溜めやすいため、日頃から素直な気持ちや本音を話し合える関係作りが欠かせません。", relationship: "穏やかで協調性が高く、周囲に安心感を与える平和主義者です。揉め事を避けるあまり自分の意見を後回しにしがちなため、時には自分の意思をしっかり伝えることで真の信頼が得られます。" },
  { work: "アイデアが豊富で、人を喜ばせる企画やイベントを打ち出すのが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で実力を発揮します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神が旺盛ですが、気分屋な面が出ると相手を困惑させることも。感情を一定に保ち、誠意を示すことが関係長続きの鍵です。", relationship: "人懐っこくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、さらに信頼性が増します。" },
  { work: "探究心が非常に強く、専門分野の知識や技術を深めていく仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で素晴らしい成果を出します。", love: "慎重で一途な恋愛傾向があり、時間をかけてゆっくりと信頼関係を築いていきます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着きがあり誠実なため、聞き手として周囲から厚い信頼を得ます。洞察力がありますが、納得いかないと心を閉ざしやすいため、自分と異なる価値観を受け入れる柔軟性を持ちましょう。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら重要な決断を下して組織を大きく動かすポジションで真価を発揮します。", love: "頼りがいがあり、パートナーを力強く引っぱっていくタイプです。情熱的ですが自分の思い通りに動かそうとしやすいため、相手の気持ちやペースを尊重する心の余裕を持つことが大切です。", relationship: "中心的存在として人を引きつけるカリスマ性を持っています。発言力があるゆえに威圧的にならないよう注意が必要です。謙虚さと思いやりを忘れないことで人望が不動のものになります。" },
  { work: "全体を見渡し、組織のバランスを円滑に整える能力に優れています。総務や事務管理、仲介業など、人と人、部署と部署をつないで現場の土台をしっかり固める仕事で高い評価を得ます。", love: "相手の立場に立って細やかに支える包容力のあるパートナーです。安心感を第一に考えますが、過保護になりすぎないよう、お互いに自立した対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても平等で親切なため、揉め事を収める仲裁役として重宝されます。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では毅然と断る強さを持つと吉です。" },
  { work: "鋭い直感力と情報収集能力を活かし、スピード感のある環境で成果を上げます。IT・マスコミやコンサルタントなど、膨大な情報を整理・分析して新しい価値を提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが非常に得意なタイプです。軽快な付き合いができますが、浅い関係で終わりがちなため、信頼できる特定の相手と深く向き合う時間も大切にしましょう。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーを持っています。営業職や新規開拓、スポーツ関連など、自らアクティブに動いて結果を出す現場で才能が開花します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のコツです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を配慮する大らかさを意識すると円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で高い適性を発揮します。", love: "ロマンチックでドラマチックな展開を好みます。人を惹きつける魅力がありますが、感情の波が大きい面も。気分をコントロールし、誠実な態度を貫くことが安定した愛に繋がります。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなる人気者です。気分屋と思われるのを防ぐため、誰に対しても分け隔てなく一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から一目置かれます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切になります。" },
  { work: "常識にとらわれない独自の視点で革新を起こす改革者です。ベンチャー企業での挑戦や商品開発、新しいシステムの導入など、自由な発想で変化を生み出す分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛されることを嫌うため、互いに自立し尊重し合える関係が理想的です。頑固にならず素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを無理に通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、人の悩みを聞き寄り添いながら解決へ導く職種で素晴らしい力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音や要望を言葉にして伝えるよう意識しましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼られます。人の悩みを抱え込んで疲れやすいため、適切な境界線を保ち自分を癒やす時間を確保することが重要です。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括マネージャー、教育関連など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず二人で過ごす過程を楽しむ心のゆとりが絆を深めます。", relationship: "器が大きく、様々な人の意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、上手に周囲へ役割を振り分けることが円滑のコツです。" },
  { work: "純粋な熱意と集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度心を決めるとまっすぐに深く愛し続けます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、互いに一人の時間を尊重する適度な距離感を保つことが成功の鍵です。", relationship: "裏表がなく誠実で信頼されますが、こだわりが強くマイペースな一面もあります。自分の世界に閉じこもらず、周りの状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で力を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを持ちましょう。", relationship: "視野が広く、人の長所を発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を大切にすると人望が一層高まります。" },
  { work: "本質を見抜き、改善点を見つけ出す鋭い洞察力を持っています。品質管理やアナリスト、組織改革の提案など、問題点を明確にして立て直す仕事で大きな才能を発揮します。", love: "上辺だけではない本質的な信頼関係を求めます。誤魔化しを嫌いオープンな対話を好みますが、相手の欠点を厳しく突きすぎないよう、温かい言葉を選ぶ優しさが欠かせません。", relationship: "嘘がなくオープンな付き合いを好みます。観察眼が鋭いため批判的になりやすい面には注意が必要です。相手の努力や良い面を積極的に評価することで円滑な関係が維持できます。" },
  { work: "計画的で、目標達成に向けて着実に業務を遂行する力があります。プロジェクト管理や行政・財務など、規律と高い正確性が求められる環境で厚い信頼を得て活躍します。", love: "真面目で約束を守る信頼性の高いパートナーです。大きな安心感を与えますが、型にはまりすぎることがあるため、時にはサプライズや感情的な触れ合いを意識すると深まります。", relationship: "責任感が強く言動が安定しているため、周囲から頼りにされます。ルールに厳しくなりすぎず、相手の事情や失敗に対しても柔軟で寛容な姿勢で接すると人間関係がスムーズになります。" },
  { work: "高い美意識と感覚的な鋭さを活かせる分野で活躍します。芸術やデザイン、ファッション、美容関連など、美しい世界観やセンスを提供することで高い評価を獲得します。", love: "理想が高く、洗練されたロマンチックな関係を好みます。センスの合う相手と惹かれ合いますが、完璧を求めすぎず、ありのままを受け入れる心のゆとりを持つことが大切です。", relationship: "品があり魅力的な雰囲気で周囲を魅了します。自分のこだわりが強いため、批判に敏感になりやすい面も。他人の意見を柔軟に受け入れる大らかさを持つと楽になります。" },
  { work: "粘り強い信念と力強いパワーで困難を乗り越える強さがあります。新規事業の立ち上げや営業、危機管理など、プレッシャーのかかる現場でタフさを発揮し結果を出します。", love: "情熱的で一途な愛情を注ぐタイプです。障害があるほど燃え上がりますが、独占欲が強くなりすぎないよう注意が必要です。相手を信頼し自由を与える余裕が良好な関係を保ちます。", relationship: "意志が強く頼りになるため、困った時に頼られる存在です。自分の考えを押し通そうとすると摩擦が起きやすいため、周囲の意見によく耳を傾ける協調性が欠かせません。" },
  { work: "豊かな想像力とインスピレーションを形にする力があります。クリエイターや執筆業、心理カウンセリングなど、目に見えない感覚や内面を表現する仕事で真価を発揮します。", love: "言葉を超えた心と心の深い繋がりを重視します。非常にロマンチックですが、現実的な問題から目を背けがちな面も。日々の生活や現実的なコミュニケーションも大切にしましょう。", relationship: "感受性が豊かで人の痛みに寄り添える優しい人柄です。周りの雰囲気を察しすぎて疲れやすいため、適度に一人でリフレッシュする時間を持ち、自分のペースを守ることが大切です。" },
  { work: "自ら先頭に立って新しい道を切り開く開拓者です。新規事業や起業、プロジェクトの立ち上げなど、強い意志とスピード感を持ってゴールへ突き進む環境で実力を発揮します。", love: "互いに高め合える自立した関係を求めます。情熱的にアプローチしますが、主導権を握りたがる傾向があるため、相手のペースや価値観を尊重することを意識しましょう。", relationship: "堂々とした存在感で周囲を引っ張るリーダーです。ブレない軸を持ち頼りにされますが、頑固になりすぎず相手の意見を受け入れる柔軟性を持つとさらに人望が集まります。" },
  { work: "組織のバランスを整え、周囲を温かくサポートする役割が得意です。人事・労務や総務、接客業など、人と接し環境をスムーズに整える仕事で高い適性を発揮します。", love: "相手を深く包み込み、細やかに気を配る優しいパートナーです。自分の気持ちを抑え込んでストレスを溜めやすいため、日頃から素直な本音を話し合える関係を心がけましょう。", relationship: "穏やかで協調性があり、誰からも愛される平和主義者です。争いを避けるあまり自分を後回しにしがちなため、時には自分の意見をはっきり伝えることで信頼がより強固になります。" },
  { work: "アイデア豊富で明るいエネルギーを周囲に伝播させます。イベント企画や広報、エンターテインメント関連など、人を笑顔にし場を盛り上げる仕事で才能が開花します。", love: "一緒にいて退屈しない楽しく刺激的な関係を好みます。サービス精神旺盛ですが、気分屋な面が出ると相手を困惑させることも。誠実で一貫した対応を見せることが大切です。", relationship: "人懐っこくユーモアがあり、場の雰囲気を和ませる人気者です。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、より一層評価が高まります。" },
  { work: "一つの物事を深く追求し、専門性を高めていく職人タイプです。研究職やエンジニア、専門的な分析業務など、緻密さと探求心が求められる職種で素晴らしい成果を出します。", love: "慎重で一途なため、じっくりと時間をかけて深い絆を作ります。派手さはありませんが安定感抜群です。思いを溜め込まず、時には素直な好きという言葉を伝えることが重要です。", relationship: "落ち着きがあり誠実で、周囲に安心感を与えます。洞察力に優れていますが、納得いかないと心を閉ざしやすいため、自分と異なる考えも受け入れる寛容さを持ちましょう。" },
  { work: "組織の中心となって大勢を力強く牽引するリーダーシップがあります。経営者やマネージャーなど、大きな決断を下して全体をダイナミックに動かす環境で輝きます。", love: "頼りがいがあり、情熱的にパートナーを引っ張ります。自分の意見を通しすぎると威圧的になりやすいため、相手の気持ちやペースを尊重する心のゆとりを持つことが鍵です。", relationship: "存在感があり、自然と人が集まるカリスマ性を持っています。発言力があるゆえに強引に見えないよう注意し、謙虚な態度と思いやりを忘れないことで強い信頼を獲得できます。" },
  { work: "チーム全体の調和を保ち、円滑な運営を支える調整役です。総務や事務管理、福祉や地域活動など、人と人をつないで現場の土台をしっかり固める仕事に向いています。", love: "相手の立場に立って温かく支える優しい愛の持ち主です。安心感を重視しますが、過保護になりすぎないよう、お互いの自立を促す対等な距離感を保つことが円満の秘訣です。", relationship: "誰に対しても親切で、揉め事を収めるのが得意な平和主義者です。八方美人と思われないよう自分の軸をしっかり持ち、必要な場面では断る強さを持つと関係が良好になります。" },
  { work: "直感力と情報収集能力が高く、スピーディーな環境で活躍します。IT・マスコミやコンサルティングなど、膨大な情報を整理・分析して新しい価値を生み出す仕事に適性があります。", love: "知的な会話や軽快なやり取りを楽しめる関係を求めます。お互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが得意なコミュニケーション上手です。浅く広い関係になりがちなため、信頼できる特定の相手とじっくり深い付き合いを育てる意識も大切です。" },
  { work: "強いエネルギーと目標達成意欲を持ち、現場を牽引します。営業職や新規事業の開拓、スポーツ関連など、自分の力でアクティブに結果を出していく環境で開花します。", love: "好きになったらまっすぐに思いを伝える情熱家です。一途ですが自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のポイントです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を汲み取る大らかさを意識しましょう。" },
  { work: "豊かな感性と華やかな魅力を持ち、人に感動を与える仕事に向いています。ブランディングや広報、芸術・デザインなど、自分のセンスを発揮して人を魅了する分野で活躍します。", love: "ロマンチックで情熱的な恋愛を好みます。人を引きつける力がありますが、感情の波が大きい傾向も。気分をコントロールし、安定した態度で接することが関係維持の秘訣です。", relationship: "華やかで場の中心になりやすい人気者です。気分屋と思われないよう、誰に対しても分け隔てなく誠実に対応することを心がけると、周囲からの信頼が一層揺るぎないものになります。" },
  { work: "アイデアを具体的な形へと落とし込む現実的な実行力があります。建設・製造や現場管理、企画の具体化など、着実に成果を作り上げていく業務で高い評価を得ます。", love: "誠実で約束をしっかり守る堅実なパートナーです。派手さはありませんが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも大切です。", relationship: "礼儀正しく責任感が強いため、目上からも後輩からも頼りにされます。ルールや形式にこだわりすぎると堅苦しく見えるため、柔軟性と大らかさを持って接すると吉です。" },
  { work: "先見の明と強い行動力を併せ持ち、ゼロから事業やプロジェクトを力強く立ち上げる能力に長けています。起業家やディレクターなど、自ら先頭に立って道を開拓していく環境で才能を発揮します。", love: "情熱的で、お互いに成長し合える自立したパートナーシップを好みます。主導権を握りたがる傾向があるため、相手の意見やペースを尊重し、耳を傾ける余裕を持つと関係が円滑になります。", relationship: "ブレない芯を持ち、堂々とした立ち振る舞いで周囲から頼りにされるリーダータイプです。頑固になりすぎず、相手の意見を柔軟に受け入れる姿勢を意識することで人望がより一層高まります。" },
  { work: "細やかな心配りと優れた調整能力を活かし、組織やチームの環境を整える役割に長けています。総務や人事、接客・サービス業など、人をサポートし現場を裏から支える仕事に適性があります。", love: "相手を包み込むような温かい優しさを持つ誠実なパートナーです。相手に気を使いすぎてストレスを溜めやすいため、日頃から素直な気持ちや本音を話し合える関係作りが欠かせません。", relationship: "穏やかで協調性が高く、周囲に安心感を与える平和主義者です。揉め事を避けるあまり自分の意見を後回しにしがちなため、時には自分の意思をしっかり伝えることで真の信頼が得られます。" },
  { work: "アイデアが豊富で、人を喜ばせる企画やイベントを打ち出すのが得意です。広報やマーケティング、エンターテインメント関連など、明るい発想で場を活性化させる仕事で実力を発揮します。", love: "一緒にいて飽きない楽しく刺激的な関係を求めます。サービス精神が旺盛ですが、気分屋な面が出ると相手を困惑させることも。感情を一定に保ち、誠意を示すことが関係長続きの鍵です。", relationship: "人懐っこくフレンドリーで、どんな場でも一瞬で雰囲気を和ませる魅力があります。人付き合いは得意ですが、軽はずみな発言や約束にならないよう配慮すると、さらに信頼性が増します。" },
  { work: "探究心が非常に強く、専門分野の知識や技術を深めていく仕事に向いています。研究職やプログラマー、データ分析など、妥協せずに精度を高めていく業務で素晴らしい成果を出します。", love: "慎重で一途な恋愛傾向があり、時間をかけてゆっくりと信頼関係を築いていきます。派手さはありませんが安定感があり、時には素直な愛情表現を言葉で伝えることが進展のポイントです。", relationship: "落ち着きがあり誠実なため、聞き手として周囲から厚い信頼を得ます。洞察力がありますが、納得いかないと心を閉ざしやすいため、自分と異なる価値観を受け入れる柔軟性を持ちましょう。" },
  { work: "圧倒的な存在感と統率力で大勢をまとめる力があります。経営者やマネージャー、プロジェクトリーダーなど、自ら重要な決断を下して組織を大きく動かすポジションで真価を発揮します。", love: "頼りがいがあり、パートナーを力強く引っぱっていくタイプです。情熱的ですが自分の思い通りに動かそうとしやすいため、相手の気持ちやペースを尊重する心の余裕を持つことが大切です。", relationship: "中心的存在として人を引きつけるカリスマ性を持っています。発言力があるゆえに威圧的にならないよう注意が必要です。謙虚さと思いやりを忘れないことで人望が不動のものになります。" },

  { work: "鋭い直感力と情報収集能力を活かし、スピード感のある環境で成果を上げます。IT・マスコミやコンサルタントなど、膨大な情報を整理・分析して新しい価値を提供する分野に向いています。", love: "知的な会話や軽やかなコミュニケーションを楽しめる関係を好みます。互いの自由を尊重し合いたいタイプですが、論理に偏りすぎず、素直な感情をオープンに示すと絆が深まります。", relationship: "話題が豊富で人脈を広げるのが非常に得意なタイプです。軽快な付き合いができますが、浅い関係で終わりがちなため、信頼できる特定の相手と深く向き合う時間も大切にしましょう。" },
  { work: "情熱とバイタリティに溢れ、目標に向かって前進するパワーを持っています。営業職や新規開拓、スポーツ関連など、自らアクティブに動いて結果を出す現場で才能が開花します。", love: "好きになったらストレートに思いを伝える熱血タイプです。一途で情熱的ですが、自分のペースで突き進みやすいため、相手の感情や都合に寄り添う落ち着きを持つことが成就のコツです。", relationship: "周囲を明るく鼓舞する頼もしい親分肌です。面倒見が良い反面、自分のペースを押し付けがちになることもあるため、相手の事情を配慮する大らかさを意識すると円満になります。" },
  { work: "優れた感性と表現力を持ち、美や感動を提供する仕事で輝きます。ブランディングや広報、デザイン、芸術分野など、自分の世界観を発信して人を魅了する領域で高い適性を発揮します。", love: "ロマンチックでドラマチックな展開を好みます。人を惹きつける魅力がありますが、感情の波が大きい面も。気分をコントロールし、誠実な態度を貫くことが安定した愛に繋がります。", relationship: "華やかな雰囲気があり、いるだけでその場が明るくなる人気者です。気分屋と思われるのを防ぐため、誰に対しても分け隔てなく一貫した対応を心がけると、信頼が長続きします。" },
  { work: "アイデアを具体的な形へ落とし込む現実的な実行力があります。建設や製造、現場の進行管理など、着実に成果物を作り上げて計画を完了させる仕事で高い信頼を獲得します。", love: "誠実でルールや約束を守る堅実な恋愛を好みます。派手なアプローチは苦手ですが大きな安心感を与えます。真面目になりすぎず、たまには感情を素直に出して甘えることも効果的です。", relationship: "礼儀正しく責任感が強いため、周囲から一目置かれます。形式やルールにこだわりすぎると堅苦しく見られるため、相手の多様な価値観を大らかに受け入れる姿勢が大切になります。" },
  { work: "常識にとらわれない独自の視点で革新を起こす改革者です。ベンチャー企業での挑戦や商品開発、新しいシステムの導入など、自由な発想で変化を生み出す分野で個性を発揮します。", love: "個性的で自由度の高いパートナーシップを好みます。束縛されることを嫌うため、互いに自立し尊重し合える関係が理想的です。頑固にならず素直な気持ちを伝えることが大切です。", relationship: "強い信念を持ち、独自の魅力を放つ存在です。自分のこだわりを無理に通そうとせず、周囲との調和を意識して相手の意見に耳を傾けることで、良好な人間関係が持続します。" },
  { work: "人の気持ちに深く寄り添うサポート能力に長けています。カウンセラーや医療・福祉、相談窓口など、人の悩みを聞き寄り添いながら解決へ導く職種で素晴らしい力を発揮します。", love: "相手の立場を第一に考え、親身に尽くす優しいパートナーです。我慢を重ねやすいため、溜め込みすぎず定期的に自分の本音や要望を言葉にして伝えるよう意識しましょう。", relationship: "穏やかで聞き上手なため、多くの人から癒やしの存在として頼られます。人の悩みを抱え込んで疲れやすいため、適切な境界線を保ち自分を癒やす時間を確保することが重要です。" },
  { work: "全体をまとめ上げ、大きな成果として集大成させる力があります。プロデューサーや統括マネージャー、教育関連など、プロジェクトを完結へ導くポジションで才能を見せます。", love: "広い包容力があり、パートナーを温かく見守る安定した愛を提供します。落ち着いた関係を築けますが、結論を急ぎすぎず二人で過ごす過程を楽しむ心のゆとりが絆を深めます。", relationship: "器が大きく、様々な人の意見を取りまとめて統合する能力があります。頼られることが多い反面、一人で抱え込みやすいため、上手に周囲へ役割を振り分けることが円滑のコツです。" },
  { work: "純粋な熱意と集中力で一つのテーマを掘り下げる職人タイプです。研究や技術開発、専門職など、妥協せずに最高品質や精度を追求していく仕事で顕著な実績を残せます。", love: "一度心を決めるとまっすぐに深く愛し続けます。純粋で嘘がない反面、愛が重くなりすぎることがあるため、互いに一人の時間を尊重する適度な距離感を保つことが成功の鍵です。", relationship: "裏表がなく誠実で信頼されますが、こだわりが強くマイペースな一面もあります。自分の世界に閉じこもらず、周りの状況や意見にも関心を持つことで協調性が生まれます。" },
  { work: "人の隠れた才能を見抜き、導く能力に優れています。教育やコーチング、コンサルティングなど、人材育成や組織のビジョンを示して人を成長させる分野で力を発揮します。", love: "お互いを高め合える知的な繋がりを重視します。良きアドバイザーとなりますが、指導的になりすぎると圧迫感を与えるため、ありのままの相手を受け入れる優しさを持ちましょう。", relationship: "視野が広く、人の長所を発見するのが得意です。相談役として重宝されますが、正論だけで押し通さず、相手の感情に寄り添う姿勢を大切にすると人望が一層高まります。" },

function dailyFortuneTexts(kin) {
  const entry = KIN_FORTUNES[(kin - 1 + 260) % 260];
  return { work: entry.work, love: entry.love, relationship: entry.relationship };
}

function todayFortuneFor(daySignIdx) {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const rand = mulberry32(month * 131 + day * 7 + daySignIdx * 991);
  const stars = 1 + Math.floor(rand() * 5);
  const text = TODAY_TEMPLATES[Math.floor(rand() * TODAY_TEMPLATES.length) % TODAY_TEMPLATES.length];
  return { month, day, stars, text };
}

function buildAttendee({ name, birthdate, isSample }) {
  const p = parseBirthdate(birthdate);
  const { kin, toneIdx, daySignIdx } = mayaInfo(p.year, p.month, p.day);
  return {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    name,
    birthdate,
    kin,
    toneIdx,
    daySignIdx,
    vec: mayaVector(toneIdx, daySignIdx),
    isSample: !!isSample,
    registeredAt: Date.now(),
  };
}

  function handleRegister(e) {
    e.preventDefault();
    if (!name.trim() || !byear || !bmonth || !bday) return;

    const birthdate = `${byear}-${String(bmonth).padStart(2, "0")}-${String(bday).padStart(2, "0")}`;
    const newAttendee = buildAttendee({ name: name.trim(), birthdate, isSample: false });
    const next = [...attendees, newAttendee];
    const scored = computeTop3(newAttendee, next);
    setAttendees(next);
    setReveal({ attendee: newAttendee, top3: scored });
    setName("");
    setByear("");
    setBmonth("");
    setBday("");
  }

  function handleReset() {
    setAttendees([]);
    setReveal(null);
    setConfirmingReset(false);
  }

  const SAMPLE_NAMES = ["さくら", "ゆかり", "たける", "みき", "しょうた", "あやか", "けんじ", "なつき"];

  function randomBirthdate() {
    const year = 1985 + Math.floor(Math.random() * 20);
    const month = 1 + Math.floor(Math.random() * 12);
    const day = 1 + Math.floor(Math.random() * 28);
    return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }

  function handleAddSamples() {
    const room = MAX_CAPACITY - attendees.length;
    const count = Math.min(3, room);
    if (count <= 0) return;

    const additions = Array.from({ length: count }).map(() => {
      const label = SAMPLE_NAMES[Math.floor(Math.random() * SAMPLE_NAMES.length)];
      return buildAttendee({ name: `${label}(サンプル)`, birthdate: randomBirthdate(), isSample: true });
    });

    setAttendees((prev) => [...prev, ...additions]);
  }

  const emptyBulkRow = () => ({ name: "", byear: "", bmonth: "", bday: "" });
  const [bulkRows, setBulkRows] = useState(Array.from({ length: 5 }, emptyBulkRow));
  const bulkMonthRefs = useRef([]);
  const bulkDayRefs = useRef([]);

  function updateBulkRow(idx, field, value) {
    setBulkRows((rows) => rows.map((r, i) => (i === idx ? { ...r, [field]: value } : r)));
  }

  function handleBulkRegister(e) {
    e.preventDefault();
    const validRows = bulkRows.filter((r) => r.name.trim() && r.byear && r.bmonth && r.bday);
    if (validRows.length === 0) return;

    const room = MAX_CAPACITY - attendees.length;
    const toAdd = validRows.slice(0, room).map((r) =>
      buildAttendee({
        name: r.name.trim(),
        birthdate: `${r.byear}-${String(r.bmonth).padStart(2, "0")}-${String(r.bday).padStart(2, "0")}`,
        isSample: false,
      })
    );

    const next = [...attendees, ...toAdd];
    setAttendees(next);
    setBulkRows(Array.from({ length: 5 }, emptyBulkRow));

    const last = toAdd[toAdd.length - 1];
    if (last) setReveal({ attendee: last, top3: computeTop3(last, next) });
  }

  const full = attendees.length >= MAX_CAPACITY;

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background:
          "radial-gradient(circle at 20% 0%, #241a3f 0%, #150f27 55%, #0f0a1d 100%)",
        color: "#F3EDE3",
        fontFamily: "'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
        .serif-jp { font-family: 'Shippori Mincho', serif; }
        @keyframes riseIn {
          from { opacity: 0; transform: translateY(14px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .rise { animation: riseIn 0.5s ease forwards; }
        select option { color: #150F27; }
      `}</style>

      <div className="max-w-5xl mx-auto px-5 py-8 md:py-12">
        {/* ヘッダー */}
        <header className="flex items-center justify-between flex-wrap gap-3 mb-10 pb-6" style={{ borderBottom: "1px solid #3A2E58" }}>
          <div className="flex items-center gap-3">
            <span style={{ fontSize: "22px" }}>✨</span>
            <h1 className="serif-jp text-2xl md:text-3xl tracking-wide" style={{ color: "#F3EDE3" }}>
              【宮崎の父おほし先生があなただけに教える占心】
            </h1>
          </div>
          <div className="flex items-center gap-2 text-sm" style={{ color: full ? "#E29A9A" : "#C9A24C" }}>
            <span>👥</span>
            <span>{attendees.length} / {MAX_CAPACITY} 名 登録済み</span>
          </div>
        </header>

        {/* 結果表示 */}
        <section className="rise" ref={resultsRef}>
          {!reveal ? (
            <div
              className="h-full min-h-[240px] flex flex-col items-center justify-center text-center rounded-lg px-6 py-10"
              style={{ border: "1px dashed #3A2E58", color: "#8477A0" }}
            >
              <div className="mb-3" style={{ fontSize: "28px" }}>🌙</div>
              <p className="serif-jp text-lg mb-1" style={{ color: "#B9AECB" }}>まだ結果はありません</p>
              <p className="text-sm">お名前と生年月日を登録すると、マヤ暦の運勢と相性の良いお相手TOP3がここに表示されます。</p>
            </div>
          ) : (
            <div className="rounded-lg p-6" style={{ background: "#1B1330", border: "1px solid #3A2E58" }}>
              <p className="text-sm mb-1" style={{ color: "#8477A0" }}>{reveal.attendee.name} さん</p>
              <p className="text-xs mb-5" style={{ color: "#8477A0" }}>
                {formatBirthdate(reveal.attendee.birthdate)}生まれ・マヤ暦 KIN{reveal.attendee.kin}
                ({TONES[reveal.attendee.toneIdx]}の{DAY_SIGNS[reveal.attendee.daySignIdx]})
              </p>

              {(() => {
                const today = todayFortuneFor(reveal.attendee.daySignIdx);
                return (
                  <div className="mb-6 px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                    <div className="flex items-center justify-between mb-1">
                      <p className="text-xs" style={{ color: "#C9A24C" }}>{today.month}月{today.day}日の運勢</p>
                      <p style={{ letterSpacing: "1px" }}>
                        <span style={{ color: "#C9A24C" }}>{"☆".repeat(today.stars)}</span>
                      </p>
                    </div>
                    <p className="text-sm leading-relaxed">{today.text}</p>
                  </div>
                );
              })()}

              <div className="grid sm:grid-cols-2 gap-3 mb-7">
                {[
                  { key: "work", label: "仕事運" },
                  { key: "love", label: "恋愛運" },
                  { key: "relationship", label: "対人関係" },
                ].map(({ key, label }) => (
                  <div key={key} className="px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                    <p className="text-xs mb-1" style={{ color: "#C9A24C" }}>{label}</p>
                    <p className="text-sm leading-relaxed">{dailyFortuneTexts(reveal.attendee.kin)[key]}</p>
                  </div>
                ))}
              </div>

              <p className="text-sm mb-3" style={{ color: "#8477A0" }}>相性の良いお相手 TOP3</p>

              {reveal.top3.length === 0 ? (
                <p style={{ color: "#8477A0" }}>まだ他に登録者がいません。次のお客様の登録をお待ちください。</p>
              ) : (
                <div className="space-y-3">
                  {reveal.top3.map((m, idx) => (
                    revealStage > idx && (
                      <div
                        key={m.id}
                        className="rise flex items-center justify-between px-4 py-3 rounded"
                        style={{
                          background: idx === 0 ? "#2E2350" : "#211A3B",
                          border: idx === 0 ? "1px solid #C9A24C" : "1px solid #3A2E58",
                        }}
                      >
                        <div className="flex items-center gap-3">
                          <span
                            className="serif-jp text-lg w-7 h-7 rounded-full flex items-center justify-center"
                            style={{
                              background: idx === 0 ? "#C9A24C" : "#3A2E58",
                              color: idx === 0 ? "#150F27" : "#F3EDE3",
                            }}
                          >
                            {idx + 1}
                          </span>
                          <span className="text-base">{m.name}</span>
                        </div>
                        <div className="flex items-center gap-1.5" style={{ color: "#E8B4BC" }}>
                          <span>❤️</span>
                          <span className="font-medium">{m.score}%</span>
                        </div>
                      </div>
                    )
                  ))}
                </div>
              )}

              <button
                onClick={() => setReveal(null)}
                className="mt-6 text-sm underline"
                style={{ color: "#8477A0" }}
              >
                閉じて次のお客様を登録する
              </button>
            </div>
          )}
        </section>

        {/* 登録フォーム */}
        <section className="mt-10 rise">
          <h2 className="serif-jp text-lg mb-4 flex items-center gap-2" style={{ color: "#C9A24C" }}>
            <span>📅</span>
            占い結果を登録
          </h2>

          <form onSubmit={handleRegister} className="space-y-4">
            <div>
              <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>
                お客様のお名前
              </label>
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="例）田中 ゆかり"
                disabled={full}
                className="w-full px-3 py-2 rounded outline-none"
                style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
              />
            </div>

            <div>
              <label className="block text-sm mb-1 flex items-center gap-1" style={{ color: "#B9AECB" }}>
                <span>📅</span> 生年月日
              </label>
              <div className="grid grid-cols-3 gap-2">
                <select
                  value={byear}
                  onChange={(e) => {
                    setByear(e.target.value);
                    if (e.target.value) monthRef.current?.focus();
                  }}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">年</option>
                  {YEAR_OPTIONS.map((y) => (
                    <option key={y} value={y}>{y}年</option>
                  ))}
                </select>
                <select
                  ref={monthRef}
                  value={bmonth}
                  onChange={(e) => {
                    setBmonth(e.target.value);
                    if (e.target.value) dayRef.current?.focus();
                  }}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">月</option>
                  {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                    <option key={m} value={m}>{m}月</option>
                  ))}
                </select>
                <select
                  ref={dayRef}
                  value={bday}
                  onChange={(e) => setBday(e.target.value)}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">日</option>
                  {Array.from({ length: daysInMonth(byear, bmonth) }, (_, i) => i + 1).map((d) => (
                    <option key={d} value={d}>{d}日</option>
                  ))}
                </select>
              </div>
            </div>

            <button
              type="submit"
              disabled={full || !name.trim() || !byear || !bmonth || !bday}
              className="w-full py-2.5 rounded font-medium transition-opacity disabled:opacity-40"
              style={{ background: "#C9A24C", color: "#150F27" }}
            >
              {full ? "満員です" : "【名前・生年月日を入力】"}
            </button>
          </form>

          <button
            onClick={handleAddSamples}
            disabled={full}
            className="mt-3 w-full py-2 rounded text-sm disabled:opacity-40"
            style={{ background: "transparent", border: "1px dashed #3A2E58", color: "#8477A0" }}
          >
            テスト用にサンプルを3件追加する
          </button>
        </section>

        {/* 5名まとめて登録(実データ用・サンプルとは別枠) */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <h2 className="serif-jp text-lg mb-1 flex items-center gap-2" style={{ color: "#C9A24C" }}>
            <span>👥</span>
            実際のお客様を5名まとめて登録
          </h2>
          <p className="text-sm mb-4" style={{ color: "#8477A0" }}>
            テスト用サンプルとは別に、実際のお客様のお名前と生年月日をまとめて登録できます。
          </p>

          <form onSubmit={handleBulkRegister} className="space-y-4">
            {bulkRows.map((row, idx) => (
              <div key={idx} className="grid md:grid-cols-12 gap-2 md:items-end pb-3" style={{ borderBottom: "1px solid #2A2145" }}>
                <div className="md:col-span-6">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>お名前</label>
                  <input
                    value={row.name}
                    onChange={(e) => updateBulkRow(idx, "name", e.target.value)}
                    placeholder={`お客様${idx + 1}のお名前`}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  />
                </div>
                <div className="md:col-span-6">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>生年月日</label>
                  <div className="grid grid-cols-3 gap-1">
                    <select
                      value={row.byear}
                      onChange={(e) => {
                        updateBulkRow(idx, "byear", e.target.value);
                        if (e.target.value) bulkMonthRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">年</option>
                      {YEAR_OPTIONS.map((y) => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkMonthRefs.current[idx] = el)}
                      value={row.bmonth}
                      onChange={(e) => {
                        updateBulkRow(idx, "bmonth", e.target.value);
                        if (e.target.value) bulkDayRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">月</option>
                      {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                        <option key={m} value={m}>{m}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkDayRefs.current[idx] = el)}
                      value={row.bday}
                      onChange={(e) => updateBulkRow(idx, "bday", e.target.value)}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">日</option>
                      {Array.from({ length: daysInMonth(row.byear, row.bmonth) }, (_, i) => i + 1).map((d) => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            ))}

            <button
              type="submit"
              disabled={full}
              className="px-5 py-2.5 rounded font-medium disabled:opacity-40"
              style={{ background: "#C9A24C", color: "#150F27" }}
            >
              入力済みのお客様をまとめて登録する
            </button>
            <p className="text-xs" style={{ color: "#8477A0" }}>
              名前・生年月日が揃っている行だけ登録されます。空欄の行は無視されます。
            </p>
          </form>
        </section>

        {/* 登録済みのお客様一覧 */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="serif-jp text-lg flex items-center gap-2" style={{ color: "#C9A24C" }}>
              <span>👥</span>
              登録済みのお客様
            </h2>
            {attendees.length > 0 && (
              !confirmingReset ? (
                <button
                  onClick={() => setConfirmingReset(true)}
                  className="text-xs flex items-center gap-1"
                  style={{ color: "#8477A0" }}
                >
                  <span>🔄</span> リセット
                </button>
              ) : (
                <div className="flex items-center gap-2 text-xs">
                  <span style={{ color: "#E8B4BC" }}>全員削除しますか?</span>
                  <button onClick={handleReset} style={{ color: "#E8B4BC" }} className="underline">はい</button>
                  <button onClick={() => setConfirmingReset(false)} style={{ color: "#8477A0" }} className="underline">いいえ</button>
                </div>
              )
            )}
          </div>

          {attendees.length === 0 ? (
            <p className="text-sm" style={{ color: "#8477A0" }}>まだ登録されているお客様がいません。</p>
          ) : (
            <ul className="space-y-1 max-h-96 overflow-y-auto pr-1">
              {attendees.slice().reverse().map((a, i) => (
                <li
                  key={a.id}
                  className="text-sm px-3 py-2 rounded flex items-center justify-between gap-2"
                  style={{ background: "#1B1330" }}
                >
                  <span className="truncate">{attendees.length - i}. {a.name}</span>
                  <span style={{ color: "#8477A0" }} className="truncate">
                    {formatBirthdate(a.birthdate)}
                  </span>
                  <button
                    onClick={(e) => {
                      e.currentTarget.blur();
                      setReveal({ attendee: a, top3: computeTop3(a, attendees) });
                    }}
                    className="text-xs shrink-0 underline"
                    style={{ color: "#C9A24C" }}
                  >
                    結果を見る
                  </button>
                </li>
              ))}
            </ul>
          )}
        </section>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<FortuneMatchApp />);
</script>
</body>
</html>
