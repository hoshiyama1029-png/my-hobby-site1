// マヤ暦(ツォルキン暦)占い: 生年月日だけで「太陽の紋章(20種)」×「銀河の音(13種)」の
// 組み合わせ(KIN1〜260)を算出し、そこから運勢・相性を判定する。
// ---------------------------------------------------------------------------
const MAX_CAPACITY = 30;

function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}
const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function daysInMonth(year, month) {
  if (!year || !month) return 31;
  if (parseInt(month, 10) === 2 && isLeapYear(parseInt(year, 10))) return 29;
  return MONTH_DAYS[parseInt(month, 10) - 1];
}
const { useState, useEffect, useRef } = React;

function parseBirthdate(dateStr) {
  if (!dateStr) return null;
  const [yStr, mStr, dStr] = dateStr.split("-");
  return { year: parseInt(yStr, 10), month: parseInt(mStr, 10), day: parseInt(dStr, 10) };
}
function formatBirthdate(dateStr) {
  const p = parseBirthdate(dateStr);
  if (!p) return "";
  return `${p.year}年${p.month}月${p.day}日`;
}

// 生年月日から「その年を365日固定」とみなした通算日数を求める。
// 一般的なマヤ暦KIN早見表はうるう年をまたいでも365日/年で計算されているため、
// この方式に合わせることで実際の早見表・計算例と一致する。
const NONLEAP_CUM_DAYS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
function pseudoAbsoluteDay(year, month, day) {
  return year * 365 + NONLEAP_CUM_DAYS[month - 1] + day;
}

// マヤ暦(ツォルキン)のKINナンバー(1〜260)を算出する。
// 基準日: 1975年3月3日 = KIN189(複数の公開されているマヤ暦KIN計算例と照合して校正済み)
function kinFromDate(year, month, day) {
  const REF_ABS = pseudoAbsoluteDay(1975, 3, 3);
  const REF_KIN_INDEX0 = 188; // KIN189の0始まりインデックス
  const diff = pseudoAbsoluteDay(year, month, day) - REF_ABS;
  const idx0 = (((REF_KIN_INDEX0 + diff) % 260) + 260) % 260;
  return idx0 + 1; // 1〜260
}

];
const TONE_VECTORS = [
  [7, 5, 4, 4], [3, 4, 7, 5], [8, 5, 3, 4], [4, 7, 8, 3], [7, 6, 5, 6],
  [4, 5, 9, 4], [5, 6, 5, 7], [6, 7, 6, 5], [8, 4, 5, 6], [7, 5, 7, 4],

];

function mayaInfo(year, month, day) {
  const kin = kinFromDate(year, month, day);
  const toneIdx = (kin - 1) % 13;
  const daySignIdx = (kin - 1) % 20;
  return { kin, toneIdx, daySignIdx };
}
function mayaVector(toneIdx, daySignIdx) {
  const t = TONE_VECTORS[toneIdx];
  const d = DAY_SIGN_VECTORS[daySignIdx];
  return t.map((v, i) => (v + d[i]) / 2);
}

function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function matchPercent(vecA, vecB) {
  const distSq = vecA.reduce((sum, v, i) => sum + (v - vecB[i]) ** 2, 0);
  const dist = Math.sqrt(distSq);
  const score = 99 - dist * 2.4;
  return Math.max(50, Math.min(99, Math.round(score)));
}

// 登録されているお客様の中からTOP3を選ぶ。
// 実際のお客様(サンプル以外)が3人以上いればサンプルは候補から外し、
// 3人未満の場合はサンプルも候補に含めつつ、必ず実際のお客様より下位に表示する。
function computeTop3(target, pool) {
  const others = pool.filter((a) => a.id !== target.id);
  const realOthers = others.filter((a) => !a.isSample);
  const sampleOthers = others.filter((a) => a.isSample);
  const candidates = realOthers.length >= 3 ? realOthers : [...realOthers, ...sampleOthers];

  return candidates
    .map((a) => ({ ...a, score: matchPercent(target.vec, a.vec) }))
    .sort((a, b) => {
      if (a.isSample !== b.isSample) return a.isSample ? 1 : -1;
      return b.score - a.score;
    })
    .slice(0, 3);
}

function todayFortuneFor(daySignIdx) {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const rand = mulberry32(month * 131 + day * 7 + daySignIdx * 991);
  const stars = 1 + Math.floor(rand() * 5);
  const text = TODAY_TEMPLATES[Math.floor(rand() * TODAY_TEMPLATES.length) % TODAY_TEMPLATES.length];
  return { month, day, stars, text };
}

function buildAttendee({ name, birthdate, isSample }) {
  const p = parseBirthdate(birthdate);
  const { kin, toneIdx, daySignIdx } = mayaInfo(p.year, p.month, p.day);
  return {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    name,
    birthdate,
    kin,
    toneIdx,
    daySignIdx,
    vec: mayaVector(toneIdx, daySignIdx),
    isSample: !!isSample,
    registeredAt: Date.now(),
  };
}

          to { opacity: 1; transform: translateY(0); }
        }
        .rise { animation: riseIn 0.5s ease forwards; }
        select option { color: #150F27; }
      `}</style>

      <div className="max-w-5xl mx-auto px-5 py-8 md:py-12">
        {/* ヘッダー */}
        <header className="flex items-center justify-between flex-wrap gap-3 mb-10 pb-6" style={{ borderBottom: "1px solid #3A2E58" }}>
          <div className="flex items-center gap-3">
            <span style={{ fontSize: "22px" }}>✨</span>
            <h1 className="serif-jp text-2xl md:text-3xl tracking-wide" style={{ color: "#F3EDE3" }}>
              【宮崎の父おほし先生があなただけに教える占心】
            </h1>
          </div>
          <div className="flex items-center gap-2 text-sm" style={{ color: full ? "#E29A9A" : "#C9A24C" }}>
            <span>👥</span>
            <span>{attendees.length} / {MAX_CAPACITY} 名 登録済み</span>
          </div>
        </header>

        {/* 結果表示 */}
        <section className="rise" ref={resultsRef}>
          {!reveal ? (
            <div
              className="h-full min-h-[240px] flex flex-col items-center justify-center text-center rounded-lg px-6 py-10"
              style={{ border: "1px dashed #3A2E58", color: "#8477A0" }}
            >
              <div className="mb-3" style={{ fontSize: "28px" }}>🌙</div>
              <p className="serif-jp text-lg mb-1" style={{ color: "#B9AECB" }}>まだ結果はありません</p>
              <p className="text-sm">お名前と生年月日を登録すると、マヤ暦の運勢と相性の良いお相手TOP3がここに表示されます。</p>
            </div>
          ) : (
            <div className="rounded-lg p-6" style={{ background: "#1B1330", border: "1px solid #3A2E58" }}>
              <p className="text-sm mb-1" style={{ color: "#8477A0" }}>{reveal.attendee.name} さん</p>
              <p className="text-xs mb-5" style={{ color: "#8477A0" }}>
                {formatBirthdate(reveal.attendee.birthdate)}生まれ・マヤ暦 KIN{reveal.attendee.kin}
                ({TONES[reveal.attendee.toneIdx]}の{DAY_SIGNS[reveal.attendee.daySignIdx]})
              </p>

              {(() => {
                const today = todayFortuneFor(reveal.attendee.daySignIdx);
                return (
                  <div className="mb-6 px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                    <div className="flex items-center justify-between mb-1">
                      <p className="text-xs" style={{ color: "#C9A24C" }}>{today.month}月{today.day}日の運勢</p>
                      <p style={{ color: "#C9A24C", letterSpacing: "1px" }}>
                        {"★".repeat(today.stars)}{"☆".repeat(5 - today.stars)}
                      </p>
                    </div>
                    <p className="text-sm leading-relaxed">{today.text}</p>
                  </div>
                );
              })()}

              <div className="grid sm:grid-cols-2 gap-3 mb-7">
                {[
                  { key: "love", label: "恋愛運" },
                  { key: "work", label: "仕事運" },
                  { key: "money", label: "金銭運" },
                  { key: "relationship", label: "対人関係" },
                ].map(({ key, label }) => (
                  <div key={key} className="px-4 py-3 rounded" style={{ background: "#211A3B", border: "1px solid #3A2E58" }}>
                    <p className="text-xs mb-1" style={{ color: "#C9A24C" }}>{label}</p>
                    <p className="text-sm leading-relaxed">{dailyFortuneTexts(reveal.attendee.kin)[key]}</p>
                  </div>
                ))}
              </div>

              <p className="text-sm mb-3" style={{ color: "#8477A0" }}>相性の良いお相手 TOP3</p>

              {reveal.top3.length === 0 ? (
                <p style={{ color: "#8477A0" }}>まだ他に登録者がいません。次のお客様の登録をお待ちください。</p>
              ) : (
                <div className="space-y-3">
                  {reveal.top3.map((m, idx) => (
                    revealStage > idx && (
                      <div
                        key={m.id}
                        className="rise flex items-center justify-between px-4 py-3 rounded"
                        style={{
                          background: idx === 0 ? "#2E2350" : "#211A3B",
                          border: idx === 0 ? "1px solid #C9A24C" : "1px solid #3A2E58",
                        }}
                      >
                        <div className="flex items-center gap-3">
                          <span
                            className="serif-jp text-lg w-7 h-7 rounded-full flex items-center justify-center"
                            style={{
                              background: idx === 0 ? "#C9A24C" : "#3A2E58",
                              color: idx === 0 ? "#150F27" : "#F3EDE3",
                            }}
                          >
                            {idx + 1}
                          </span>
                          <span className="text-base">{m.name}</span>
                        </div>
                        <div className="flex items-center gap-1.5" style={{ color: "#E8B4BC" }}>
                          <span>❤️</span>
                          <span className="font-medium">{m.score}%</span>
                        </div>
                      </div>
                    )
                  ))}
                </div>
              )}

              <button
                onClick={() => setReveal(null)}
                className="mt-6 text-sm underline"
                style={{ color: "#8477A0" }}
              >
                閉じて次のお客様を登録する
              </button>
            </div>
          )}
        </section>

        {/* 登録フォーム */}
        <section className="mt-10 rise">
          <h2 className="serif-jp text-lg mb-4 flex items-center gap-2" style={{ color: "#C9A24C" }}>
            <span>📅</span>
            占い結果を登録
          </h2>

          <form onSubmit={handleRegister} className="space-y-4">
            <div>
              <label className="block text-sm mb-1" style={{ color: "#B9AECB" }}>
                お客様のお名前
              </label>
              <input
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="例）田中 ゆかり"
                disabled={full}
                className="w-full px-3 py-2 rounded outline-none"
                style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
              />
            </div>

            <div>
              <label className="block text-sm mb-1 flex items-center gap-1" style={{ color: "#B9AECB" }}>
                <span>📅</span> 生年月日
              </label>
              <div className="grid grid-cols-3 gap-2">
                <select
                  value={byear}
                  onChange={(e) => {
                    setByear(e.target.value);
                    if (e.target.value) monthRef.current?.focus();
                  }}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">年</option>
                  {YEAR_OPTIONS.map((y) => (
                    <option key={y} value={y}>{y}年</option>
                  ))}
                </select>
                <select
                  ref={monthRef}
                  value={bmonth}
                  onChange={(e) => {
                    setBmonth(e.target.value);
                    if (e.target.value) dayRef.current?.focus();
                  }}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">月</option>
                  {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                    <option key={m} value={m}>{m}月</option>
                  ))}
                </select>
                <select
                  ref={dayRef}
                  value={bday}
                  onChange={(e) => setBday(e.target.value)}
                  disabled={full}
                  className="w-full px-2 py-2 rounded outline-none"
                  style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                >
                  <option value="">日</option>
                  {Array.from({ length: daysInMonth(byear, bmonth) }, (_, i) => i + 1).map((d) => (
                    <option key={d} value={d}>{d}日</option>
                  ))}
                </select>
              </div>
            </div>

            <button
              type="submit"
              disabled={full || !name.trim() || !byear || !bmonth || !bday}
              className="w-full py-2.5 rounded font-medium transition-opacity disabled:opacity-40"
              style={{ background: "#C9A24C", color: "#150F27" }}
            >
              {full ? "満員です" : "【名前・生年月日を入力】"}
            </button>
          </form>

          <button
            onClick={handleAddSamples}
            disabled={full}
            className="mt-3 w-full py-2 rounded text-sm disabled:opacity-40"
            style={{ background: "transparent", border: "1px dashed #3A2E58", color: "#8477A0" }}
          >
            テスト用にサンプルを3件追加する
          </button>
        </section>

        {/* 5名まとめて登録(実データ用・サンプルとは別枠) */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <h2 className="serif-jp text-lg mb-1 flex items-center gap-2" style={{ color: "#C9A24C" }}>
            <span>👥</span>
            実際のお客様を5名まとめて登録
          </h2>
          <p className="text-sm mb-4" style={{ color: "#8477A0" }}>
            テスト用サンプルとは別に、実際のお客様のお名前と生年月日をまとめて登録できます。
          </p>

          <form onSubmit={handleBulkRegister} className="space-y-4">
            {bulkRows.map((row, idx) => (
              <div key={idx} className="grid md:grid-cols-12 gap-2 md:items-end pb-3" style={{ borderBottom: "1px solid #2A2145" }}>
                <div className="md:col-span-6">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>お名前</label>
                  <input
                    value={row.name}
                    onChange={(e) => updateBulkRow(idx, "name", e.target.value)}
                    placeholder={`お客様${idx + 1}のお名前`}
                    disabled={full}
                    className="w-full px-3 py-2 rounded outline-none"
                    style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                  />
                </div>
                <div className="md:col-span-6">
                  <label className="block text-xs mb-1" style={{ color: "#8477A0" }}>生年月日</label>
                  <div className="grid grid-cols-3 gap-1">
                    <select
                      value={row.byear}
                      onChange={(e) => {
                        updateBulkRow(idx, "byear", e.target.value);
                        if (e.target.value) bulkMonthRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">年</option>
                      {YEAR_OPTIONS.map((y) => (
                        <option key={y} value={y}>{y}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkMonthRefs.current[idx] = el)}
                      value={row.bmonth}
                      onChange={(e) => {
                        updateBulkRow(idx, "bmonth", e.target.value);
                        if (e.target.value) bulkDayRefs.current[idx]?.focus();
                      }}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">月</option>
                      {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => (
                        <option key={m} value={m}>{m}</option>
                      ))}
                    </select>
                    <select
                      ref={(el) => (bulkDayRefs.current[idx] = el)}
                      value={row.bday}
                      onChange={(e) => updateBulkRow(idx, "bday", e.target.value)}
                      disabled={full}
                      className="w-full px-1 py-2 rounded outline-none text-sm"
                      style={{ background: "#1F1638", border: "1px solid #3A2E58", color: "#F3EDE3" }}
                    >
                      <option value="">日</option>
                      {Array.from({ length: daysInMonth(row.byear, row.bmonth) }, (_, i) => i + 1).map((d) => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            ))}

            <button
              type="submit"
              disabled={full}
              className="px-5 py-2.5 rounded font-medium disabled:opacity-40"
              style={{ background: "#C9A24C", color: "#150F27" }}
            >
              入力済みのお客様をまとめて登録する
            </button>
            <p className="text-xs" style={{ color: "#8477A0" }}>
              名前・生年月日が揃っている行だけ登録されます。空欄の行は無視されます。
            </p>
          </form>
        </section>

        {/* 登録済みのお客様一覧 */}
        <section className="mt-10 pt-8" style={{ borderTop: "1px solid #3A2E58" }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="serif-jp text-lg flex items-center gap-2" style={{ color: "#C9A24C" }}>
              <span>👥</span>
              登録済みのお客様
            </h2>
            {attendees.length > 0 && (
              !confirmingReset ? (
                <button
                  onClick={() => setConfirmingReset(true)}
                  className="text-xs flex items-center gap-1"
                  style={{ color: "#8477A0" }}
                >
                  <span>🔄</span> リセット
                </button>
              ) : (
                <div className="flex items-center gap-2 text-xs">
                  <span style={{ color: "#E8B4BC" }}>全員削除しますか?</span>
                  <button onClick={handleReset} style={{ color: "#E8B4BC" }} className="underline">はい</button>
                  <button onClick={() => setConfirmingReset(false)} style={{ color: "#8477A0" }} className="underline">いいえ</button>
                </div>
              )
            )}
          </div>

          {attendees.length === 0 ? (
            <p className="text-sm" style={{ color: "#8477A0" }}>まだ登録されているお客様がいません。</p>
          ) : (
            <ul className="space-y-1 max-h-96 overflow-y-auto pr-1">
              {attendees.slice().reverse().map((a, i) => (
                <li
                  key={a.id}
                  className="text-sm px-3 py-2 rounded flex items-center justify-between gap-2"
                  style={{ background: "#1B1330" }}
                >
                  <span className="truncate">{attendees.length - i}. {a.name}</span>
                  <span style={{ color: "#8477A0" }} className="truncate">
                    {formatBirthdate(a.birthdate)}
                  </span>
                  <button
                    onClick={(e) => {
                      e.currentTarget.blur();
                      setReveal({ attendee: a, top3: computeTop3(a, attendees) });
                    }}
                    className="text-xs shrink-0 underline"
                    style={{ color: "#C9A24C" }}
                  >
                    結果を見る
                  </button>
                </li>
              ))}
            </ul>
          )}
        </section>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<FortuneMatchApp />);
</script>
</body>
</html>
